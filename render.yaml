# Blueprint per Render (piano gratuito). Il database è su Neon: DATABASE_URL va incollato a mano nel pannello Render.
services:
  - type: web
    name: garecri
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /salute
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false            # indirizzo di connessione di Neon (termina con ?sslmode=require)
      - key: JWT_SECRET
        generateValue: true    # Render genera una stringa casuale
      - key: TRUST_PROXY
        value: "1"             # dietro il proxy HTTPS di Render: limite login per IP reale
      - key: PUBLIC_URL
        sync: false            # OBBLIGATORIO: indirizzo pubblico https senza / finale, es. https://gpser.fbcri.eu. Senza, il server non parte
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DOMINI
        sync: false            # es. cri.it: con Google entra solo l'account istituzionale di quel dominio (e sottodomini). Vuota = nessun limite
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT
        sync: false            # ID (GUID) del tenant Microsoft Entra della tua organizzazione
      - key: RESEND_API_KEY
        sync: false            # email di avviso e codice di verifica dell'indirizzo per chi si registra con password (serve un dominio verificato: NOTIFICA_DA)
      - key: BACKUP_PASSPHRASE
        sync: false            # frase che cifra i backup: senza, il database non si scarica né si invia
      - key: NOTIFICA_EMAIL
        sync: false            # dove ricevere l avviso
