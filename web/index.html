<!doctype html>
<html lang="it">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GareCRI</title>
<style>
  :root { --rosso:#E3001B; --bg:#f4f4f6; --card:#fff; --testo:#1c1c1e; --bordo:#d6d6da;
          --mb:#15803D; --be:#84CC16; --su:#FACC15; --in:#F97316; --ne:#B91C1C; }   /* semaforo a cinque toni ben distinti: verde, lime, giallo, arancio, rosso */   /* dal verde smeraldo (molto bene) al rosso (non eseguito) */
  * { box-sizing: border-box; }
  body { margin:0; font:16px system-ui, sans-serif; background:var(--bg); color:var(--testo); }
  header { background:var(--rosso); color:#fff; padding:10px 16px; display:flex; gap:12px; align-items:center; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header .logo { height:38px; background:#fff; border-radius:8px; padding:2px 4px; }
  header a { color:#fff; font-size:14px; text-decoration:none; background:#fff3; padding:8px 12px; border-radius:8px; }
  .pub h2 { margin:0 0 6px; } .notizia { border-top:1px solid var(--bordo); padding:10px 0; } .mappa { width:100%; height:380px; border:0; border-radius:10px; }
  .scene-mappa a { display:inline-block; margin:4px 10px 4px 0; }
  header button { background:#fff3; color:#fff; border:0; padding:8px 12px; border-radius:8px; font-size:14px; }
  main { max-width:900px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px #0001; }
  label { display:block; font-size:13px; color:#666; margin:8px 0 4px; }
  select, input { width:100%; padding:12px; font-size:16px; border:1px solid var(--bordo); border-radius:8px; background:#fff; }
  .btn { display:inline-block; background:var(--rosso); color:#fff; border:0; padding:14px 18px; border-radius:10px; font-size:16px; margin-top:10px; text-decoration:none; }
  .btn.sec { background:#555; }
  .sezione { background:#e7e6e6; padding:8px 10px; font-weight:600; border-radius:8px; margin:14px 0 6px; }
  main.largo { max-width:1180px; }
  .voce { background:var(--card); border-radius:10px; padding:8px 10px; margin-bottom:6px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .voce.manca { outline:3px solid #C62828; }
  .voce p { margin:0; flex:1 1 320px; min-width:200px; text-align:left; line-height:1.3; }
  .liv { display:flex; gap:6px; flex:0 0 auto; }
  .liv button { width:118px; padding:8px 2px; font-size:13px; font-weight:700; border:2px solid #111; color:#111; background:#fff; border-radius:8px; min-height:44px; white-space:nowrap; }
  .sola-lettura .liv button { pointer-events:none; opacity:.85; }
  .avviso { background:#fff4d6; border:1px solid #e6c34a; border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .liv button[disabled] { background:#000; border-color:#000; }
  .liv button.on { color:#fff !important; border-color:#111; }
  .liv button.on[data-l=BE], .liv button.on[data-l=SU], .liv button.on[data-l=IN] { color:#111 !important; }
  .liv button.on::before { content:'✓ '; }
  .liv button.on[data-l=MB] { background:var(--mb) } .liv button.on[data-l=BE] { background:var(--be) }
  .liv button.on[data-l=SU] { background:var(--su) } .liv button.on[data-l=IN] { background:var(--in) }
  .liv button.on[data-l=NE] { background:var(--ne) }
  .msg-blocco { color:#B71C1C; font-weight:700; }
  .barra { position:sticky; bottom:0; background:var(--card); padding:10px 12px; border-top:1px solid var(--bordo); display:flex; gap:10px; align-items:center; }
  .barra .stato { flex:1; font-size:14px; }
  table { width:100%; border-collapse:collapse; } td, th { padding:8px 6px; border-bottom:1px solid var(--bordo); text-align:left; }
  td.n, th.n { text-align:right; }
  .err { color:#C62828; } .ok { color:#2E7D32; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:14px; }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; text-decoration:none; color:#222; background:#fff; border:2px solid var(--bordo); border-radius:18px; padding:28px 12px; min-height:190px; }
  .tile .ico { width:80px; height:80px; color:#fff; background:var(--rosso); border-radius:50%; display:flex; align-items:center; justify-content:center; } .tile .ico svg { width:48px; height:48px; }
  .tile b { font-size:22px; } .tile span { font-size:13px; color:#555; } .tile:active, .tile:hover { border-color:var(--rosso); box-shadow:0 4px 14px #0002; }
  .btn.grande { display:block; text-align:center; font-size:18px; padding:16px 12px; }
  .avv { border-top:1px solid var(--bordo); padding:8px 0; }
  @media (max-width:860px) { .liv { width:100%; } .liv button { flex:1 1 0; width:auto; min-width:0; font-size:12px; } }
</style>
</head>
<body>
<header><img class="logo" src="/logo-cri.jpg" alt="Croce Rossa Italiana"><h1 id="titolo">GareCRI</h1><a id="hhome" href="#" hidden>Home</a><button id="esci" hidden>Esci</button></header>
<main id="app"></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const LIV = [['MB','Molto bene'],['BE','Bene'],['SU','Soddisfacente'],['IN','Insufficiente'],['NE','Non eseguito']];   // nessun punteggio: chi inserisce i dati non lo conosce
const master = () => me && me.ruolo === 'giudice_master';
let token = localStorage.getItem('token'), me = JSON.parse(localStorage.getItem('me') || 'null');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const org = () => me && ['admin','organizzazione'].includes(me.ruolo);

async function api(path, opt = {}) {
  const r = await fetch('/api' + path, { method: opt.method || (opt.body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 401 && path !== '/login') { logout(); throw new Error('sessione scaduta'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.errore || r.statusText), { stato: r.status, definitivo: r.status >= 400 && r.status < 500 && r.status !== 401 && r.status !== 429 });
  return j;
}
// il PDF si scarica con l'intestazione Authorization: il token non finisce mai nell'indirizzo, nei log o nella cronologia
async function apriPdf(url) {
  const w = window.open('', '_blank');
  try {
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).errore || r.statusText);
    w.location = URL.createObjectURL(await r.blob());
  } catch (e) { w.close(); alert('PDF non generato: ' + e.message); }
}
// il logout NON cancella la coda: i dati non inviati restano legati all'utente e ripartono al suo prossimo accesso
function logout() { localStorage.removeItem('token'); localStorage.removeItem('me'); token = me = coda = null; location.hash = ''; route(); }
$('#esci').onclick = logout;


// ── mappa del percorso: incorporamento Google My Maps + link a Google Maps per ogni scena ──
const puntoMaps = (sc) => (sc.lat != null && sc.lng != null ? `${sc.lat},${sc.lng}` : (sc.indirizzo || ''));
function mappaHtml(ev, scene) {
  const punti = (scene || []).filter((x) => puntoMaps(x));
  if (!ev.mappa_url && !punti.length) return '';
  const q = (x) => encodeURIComponent(puntoMaps(x));
  const percorso = punti.length >= 2
    ? `https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${q(punti[0])}&destination=${q(punti[punti.length - 1])}${punti.length > 2 ? '&waypoints=' + punti.slice(1, -1).map(q).join('%7C') : ''}` : '';
  return `<div class="card"><strong>Percorso gara</strong>
    ${ev.mappa_url ? `<iframe class="mappa" src="${esc(ev.mappa_url)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>` : ''}
    <div class="scene-mappa">${punti.map((x) => `<a href="https://www.google.com/maps/search/?api=1&query=${q(x)}" target="_blank" rel="noopener">📍 Scena ${esc(x.codice)} – ${esc(x.titolo)}</a>`).join('')}
    ${percorso ? `<br><a class="btn" href="${percorso}" target="_blank" rel="noopener">Apri il percorso in Google Maps</a>` : ''}</div></div>`;
}
async function vistaPubblica() {
  $('#esci').hidden = true; $('#hhome').hidden = true; $('#titolo').textContent = 'Gare di primo soccorso · Croce Rossa Italiana';
  let d = { avvisi: [], eventi: [] }; try { d = await api('/pubblico'); } catch { /* offline: resta la pagina base */ }
  const oggiS = oggi();
  const prossime = d.eventi.filter((e) => e.attivo || (e.data && e.data >= oggiS)).sort((a, b) => String(a.data).localeCompare(String(b.data)));
  const passate = d.eventi.filter((e) => !prossime.includes(e));
  const riga = (e) => `<div class="notizia"><b>${esc(e.nome)}</b>${e.attivo ? ' · <span class="ok">in corso</span>' : ''}<br><small>${e.tipo === 'olimpiadi' ? 'Olimpiadi' : 'Gara'} · ${esc(e.luogo || '')} ${esc(e.data || '')}</small></div>`;
  const inCorso = d.eventi.find((e) => e.attivo) || prossime[0] || d.eventi.find((e) => e.mappa_url || e.scene.length);
  $('#app').innerHTML = `<div class="card pub" style="text-align:center"><img src="/logo-cri.jpg" alt="Croce Rossa Italiana" style="height:90px">
      <h2>Gare di primo soccorso</h2><p>Notizie, edizioni e percorso gara.</p><a class="btn" href="#login">Accedi</a></div>
    <div class="card pub"><h2>Prossime edizioni</h2>${prossime.length ? prossime.map(riga).join('') : '<p><small>Nessuna edizione in programma.</small></p>'}</div>
    <div class="card pub"><h2>Notizie</h2>${d.avvisi.length ? d.avvisi.map((a) => `<div class="notizia"><b>${esc(a.titolo)}</b>${a.testo ? `<br>${esc(a.testo)}` : ''}<br><small>${esc(String(a.created_at).slice(0, 10))}</small></div>`).join('') : '<p><small>Nessuna notizia.</small></p>'}</div>
    ${inCorso ? mappaHtml(inCorso, inCorso.scene) : ''}
    ${passate.length ? `<div class="card pub"><h2>Edizioni passate</h2>${passate.map(riga).join('')}</div>` : ''}`;
}

function vistaLogin() {
  $('#esci').hidden = true; $('#hhome').hidden = false;
  $('#app').innerHTML = `<div class="card"><h2>Accesso</h2>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go">Entra</button> <span id="msg" class="err"></span></div>`;
  $('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
  $('#go').onclick = async () => {
    try {
      const r = await api('/login', { body: { email: $('#em').value, password: $('#pw').value } });
      token = r.token; me = r.utente; localStorage.setItem('token', token); localStorage.setItem('me', JSON.stringify(me));
      await preparaCoda(); location.hash = ''; route();
    } catch (e) { $('#msg').textContent = e.message; }
  };
}

// gara corrente: chi è legato a una gara resta in quella; organizzazione e admin scelgono dal menu
async function garaCorrente() {
  const eventi = await api('/eventi');
  let ev = null;
  if (org()) ev = eventi.find((e) => e.id === localStorage.getItem('ev'));
  ev = ev || eventi.find((e) => e.id === me.evento_id) || eventi.find((e) => e.attivo) || eventi[0] || null;
  if (ev) localStorage.setItem('ev', ev.id);
  window.__ev = ev;
  return { ev, eventi };
}
const ICONE = {"valutazione": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"/><path d=\"M9 8l1.5 1.5L13 7M9 14l1.5 1.5L13 13M15 8h1M15 14h1\"/></svg>", "gestione": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"/></svg>", "monitor": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l3-7 4 14 3-7h4\"/></svg>"};
const oggi = () => new Date().toISOString().slice(0, 10);
const statoGara = (e) => (e.attivo ? 'in corso' : (e.data && e.data > oggi() ? 'prossima' : 'passata'));
function menuGare(eventi, corrente) {
  const gruppi = [['In corso', eventi.filter((e) => statoGara(e) === 'in corso')], ['Prossime', eventi.filter((e) => statoGara(e) === 'prossima')], ['Passate', eventi.filter((e) => statoGara(e) === 'passata')]];
  return `<select id="selgara">${gruppi.filter(([, l]) => l.length).map(([n, l]) => `<optgroup label="${n}">${l.map((e) => `<option value="${e.id}" ${corrente && e.id === corrente.id ? 'selected' : ''}>${esc(e.nome)} · ${esc(e.luogo || '')} ${esc(e.data || '')}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
async function vistaHome() {
  $('#esci').hidden = false; $('#hhome').hidden = true; $('#titolo').textContent = 'GareCRI';
  const { ev, eventi } = await garaCorrente();
  if (!ev) { $('#app').innerHTML = '<div class="card">Nessuna gara.' + (org() ? ' <a class="btn" href="/admin.html">Vai a Gestione per crearne una</a>' : ' Chiedi all\'organizzazione di assegnartene una.') + '</div>'; return; }
  const avvisi = await api(`/avvisi?evento=${ev.id}`).catch(() => []);
  const scene = await api(`/eventi/${ev.id}/scene`).catch(() => []);
  const tipoGara = ev.tipo === 'olimpiadi' ? 'Olimpiadi' : 'Gara';
  $('#app').innerHTML = `<div class="card"><small>${tipoGara} ${statoGara(ev)}</small><h2 style="margin:2px 0 4px">${esc(ev.nome)}</h2>
    <div>${esc(ev.luogo || '')} ${esc(ev.data || '')}</div>
    ${org() ? `<label>Cambia gara</label>${menuGare(eventi, ev)}` : ''}
    <div class="tiles">
      <a class="tile" href="#valutazione"><i class="ico">${ICONE.valutazione}</i><b>Valutazione</b><span>${esc(ev.nome)}</span></a>
      ${org() ? `<a class="tile" href="/admin.html"><i class="ico">${ICONE.gestione}</i><b>Gestione</b><span>Scene, schede, squadre, classifiche</span></a>
      <a class="tile" href="#monitor"><i class="ico">${ICONE.monitor}</i><b>Monitor</b><span>Avanzamento delle schede</span></a>` : ''}</div></div>
    ${mappaHtml(ev, scene)}
    <div class="card"><strong>Avvisi e informazioni</strong>${avvisi.length ? avvisi.map((a) => `<div class="avv"><b>${esc(a.titolo)}</b>${a.testo ? `<br>${esc(a.testo)}` : ''}<br><small>${esc(String(a.created_at).slice(0, 10))}</small></div>`).join('') : '<p><small>Nessun avviso.</small></p>'}</div>`;
  if ($('#selgara')) $('#selgara').onchange = () => { localStorage.setItem('ev', $('#selgara').value); vistaHome(); };
  const cc = coda.conta();
  if (cc.inCoda || cc.rifiutate) {
    const rif = coda.elencoRifiutate();
    $('#app').insertAdjacentHTML('beforeend', `<div class="card"><strong>Dati sul dispositivo</strong><br>
      ${cc.inCoda ? `${cc.inCoda} modifiche non ancora inviate. ` : ''}${rif.length ? `${rif.length} invii rifiutati dal server:<ul>${rif.map(r => `<li>${esc(r.errore)}</li>`).join('')}</ul>` : ''}
      <button class="btn" id="invia-ora">Invia ora</button> ${rif.length ? '<button class="btn sec" id="ripristina">Riprova i rifiutati</button>' : ''} <span id="esito"></span></div>`);
    $('#invia-ora').onclick = async () => { const r = await coda.svuota(); $('#esito').textContent = r.ok ? 'Inviato' : r.errori.join('; '); setTimeout(vistaHome, 1200); };
    if ($('#ripristina')) $('#ripristina').onclick = () => { coda.riprovaRifiutate(); vistaHome(); };
  }
}

// scelta di scena, scheda e squadra della gara corrente
async function vistaSelezione() {
  $('#esci').hidden = false; $('#hhome').hidden = false;
  const { ev } = await garaCorrente();
  if (!ev) { location.hash = ''; return; }
  $('#titolo').textContent = 'Valutazione';
  const [scene, squadre] = await Promise.all([api(`/eventi/${ev.id}/scene`), api(`/eventi/${ev.id}/squadre`)]);
  const scAvail = scene.filter(s => s.schede && s.schede.length);
  $('#app').innerHTML = `<div class="card"><strong>${esc(ev.nome)}</strong><br><small>${esc(ev.luogo || '')} ${esc(ev.data || '')}</small>
    <label>Scena</label><select id="sc">${scAvail.map((s, i) => `<option value="${i}">${esc(s.codice)} – ${esc(s.titolo)}</option>`).join('')}</select>
    <label>Scheda</label><select id="sk"></select>
    <label>Squadra</label><select id="sq">${squadre.filter(s => s.attiva).map(s => `<option value="${s.id}">${s.numero} – ${esc(s.nome)}</option>`).join('')}</select>
    <button class="btn" id="avvia">Inizia valutazione</button> <a class="btn sec" href="#">Home</a></div>`;
  const chiaveSel = `selezione_${me.id}_${ev.id}`;   // l'ultima scelta resta anche tornando indietro e dopo un riavvio
  let ultima = {}; try { ultima = JSON.parse(localStorage.getItem(chiaveSel) || '{}'); } catch { /* ignora */ }
  const salvaSel = () => { try { localStorage.setItem(chiaveSel, JSON.stringify({ scena: scAvail[$('#sc').value]?.id, scheda: $('#sk').value, squadra: $('#sq').value })); } catch { /* ignora */ } };
  const aggSchede = () => { const s = scAvail[$('#sc').value]; $('#sk').innerHTML = (s ? s.schede : []).map(k => `<option value="${k.id}">${esc(k.titolo)}</option>`).join(''); };
  const iScena = scAvail.findIndex(s => s.id === ultima.scena); if (iScena >= 0) $('#sc').value = String(iScena);
  aggSchede();
  if ([...$('#sk').options].some(o => o.value === ultima.scheda)) $('#sk').value = ultima.scheda;
  if ([...$('#sq').options].some(o => o.value === ultima.squadra)) $('#sq').value = ultima.squadra;
  $('#sc').onchange = () => { aggSchede(); salvaSel(); }; $('#sk').onchange = salvaSel; $('#sq').onchange = salvaSel;
  $('#avvia').onclick = () => { salvaSel(); location.hash = `#valuta/${$('#sk').value}/${$('#sq').value}/${ev.id}`; };
}

// ── coda di salvataggio locale (modulo /coda.js, con test automatici) ──
let coda = null;
async function preparaCoda() {
  if (!me) return null;
  const { creaCoda } = await import('/coda.js');
  coda = creaCoda({ storage: localStorage, chiave: 'coda_v2_' + me.id,      // una coda per utente
    invia: (payload) => api('/sync', { body: { ...payload, origine: 'tablet_online' } }) });
  return coda;
}
addEventListener('online', () => coda && coda.svuota());

async function vistaValuta(schedaId, squadraId) {
  const [scheda, cur, squadreEv] = await Promise.all([api(`/schede/${schedaId}`), api(`/compilazioni?scheda=${schedaId}&squadra=${squadraId}`),
    api(`/eventi/${window.__ev?.id || localStorage.getItem('ev')}/squadre`).catch(() => [])]);
  const nomeSq = (squadreEv.find((x) => x.id === squadraId)?.nome || '').toUpperCase();
  const stato = cur.compilazione?.stato || 'bozza';
  const chiusa = stato === 'verificata';
  const puoChiudere = org() || master();                       // organizzazione e giudice master verificano/chiudono
  const soloLettura = chiusa && !org();                         // scheda chiusa: il giudice non può più modificarla (il master la riapre)
  const chiave = `${schedaId}|${squadraId}`;
  const meta = { id: cur.compilazione?.id || coda.idPer(chiave) || crypto.randomUUID(), scheda_id: schedaId, squadra_id: squadraId };
  const ris = new Map(cur.risposte.map(r => [r.voce_id, r.livello]));
  for (const [v, p] of Object.entries(coda.pendenti(chiave))) { if (p.livello === null) ris.delete(v); else ris.set(v, p.livello); }   // mostra anche ciò che non è ancora partito
  let sezione = null, html = '';
  for (const v of scheda.voci) {
    if (v.sezione !== sezione) { sezione = v.sezione; html += `<div class="sezione">${esc(sezione)}</div>`; }
    html += `<div class="voce" data-id="${v.id}"><p>${esc(v.testo)}</p><div class="liv">` +
      LIV.map(([k, et]) => !v.consentiti.includes(k) ? `<button disabled></button>` :
        `<button data-l="${k}" class="${ris.get(v.id) === k ? 'on' : ''}">${et}</button>`).join('') + `</div></div>`;
  }
  $('#titolo').textContent = scheda.titolo;
  const chi = cur.compilazione?.giudice ? ` · compilata da ${esc(cur.compilazione.giudice)}` : '';
  const sq = nomeSq ? `${esc(nomeSq)} – ` : '';
  const banner = chiusa ? `<div class="avviso"><strong>${sq}Scheda chiusa (verificata).</strong>${chi} ${soloLettura ? 'Solo il giudice master o l\'organizzazione possono riaprirla.' : ''}</div>`
    : stato === 'completata' ? `<div class="avviso"><strong>${sq}Completata${chi}</strong> · in attesa della verifica del giudice master.</div>`
    : (master() && cur.compilazione ? `<div class="avviso"><strong>${sq}In compilazione</strong>${chi}.</div>` : (nomeSq ? `<div class="avviso"><strong>${esc(nomeSq)}</strong></div>` : ''));
  $('#app').innerHTML = banner + html + `<div class="barra"><span class="stato" id="st"></span>
    <button class="btn sec" id="indietro">Indietro</button>
    ${chiusa ? (puoChiudere && cur.compilazione ? '<button class="btn" id="riapri">Riapri scheda</button>' : '')
      : `<button class="btn ${puoChiudere ? 'sec' : ''}" id="compl">Completa</button>${puoChiudere ? '<button class="btn" id="verif">Verifica e chiudi</button>' : ''}`}</div>`;
  if (soloLettura) $('#app').classList.add('sola-lettura');
  else $('#app').classList.remove('sola-lettura');
  const tot = scheda.voci.length;
  const agg = (msg = '', errore = false) => { $('#st').innerHTML = `${ris.size}/${tot} voci <span class="${errore ? 'err' : 'ok'}">${esc(msg)}</span>`; };
  agg();
  const invia = async () => {
    const r = await coda.svuota();
    if (r.ok) agg(r.scartate ? `⚠ ${r.scartate} modifiche scartate: ne esistono di più recenti o dell'organizzazione` : '✓ salvato', !!r.scartate);
    else if (r.rifiutate) agg(`⚠ ${r.rifiutate} invii rifiutati dal server: ${r.errori.join('; ')} (i dati sono conservati, vedi Home)`, true);
    else agg('! in coda, non ancora inviato: ' + r.errori.join('; '), true);
    return r;
  };
  let timer;
  $('#app').onclick = (ev) => {
    const b = ev.target.closest('.liv button'); if (!b || b.disabled || soloLettura) return;
    const id = b.closest('.voce').dataset.id, l = b.dataset.l;
    const nuovo = ris.get(id) === l ? null : l;                       // toccare di nuovo la scelta la annulla
    if (nuovo === null) ris.delete(id); else ris.set(id, nuovo);
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', nuovo !== null && x === b));
    b.closest('.voce').classList.remove('manca');
    if (!document.querySelector('.voce.manca')) agg('');
    coda.voce(chiave, meta, id, nuovo);                                // subito su disco, poi invio ritardato
    agg('…'); clearTimeout(timer); timer = setTimeout(() => invia().catch(() => {}), 600);
  };
  $('#indietro').onclick = () => { location.hash = '#valutazione'; };
  // completamento: le voci non compilate vengono evidenziate e segnalate prima di chiudere
  const chiudiScheda = (nuovoStato) => async () => {
    document.querySelectorAll('.voce.manca').forEach(e => e.classList.remove('manca'));
    const mancanti = scheda.voci.filter(v => !ris.has(v.id));
    if (mancanti.length) {          // la scheda non si chiude finché ogni voce non ha una valutazione: si resta qui
      mancanti.forEach(v => document.querySelector(`.voce[data-id="${v.id}"]`).classList.add('manca'));
      document.querySelector('.voce.manca').scrollIntoView({ block: 'center', behavior: 'smooth' });
      $('#st').innerHTML = `<span class="msg-blocco">Mancano ${mancanti.length} voci (evidenziate in rosso): compilale per chiudere la scheda.</span>`;
      return;
    }
    clearTimeout(timer); coda.stato(chiave, meta, nuovoStato);
    const r = await invia();
    if (r.ok) location.hash = '#valutazione'; else alert('Non ancora salvato: ' + r.errori.join('; ') + '\nI dati restano sul dispositivo e verranno rimandati.');
  };
  if ($('#compl')) $('#compl').onclick = chiudiScheda('completata');
  if ($('#verif')) $('#verif').onclick = chiudiScheda('verificata');
  if ($('#riapri')) $('#riapri').onclick = async () => {
    try { await api(`/compilazioni/${cur.compilazione.id}/riapri`, { method: 'POST', body: {} }); vistaValuta(schedaId, squadraId); }
    catch (e) { alert(e.message); }
  };
  invia().catch(() => {});                                             // eventuali dati rimasti da una sessione precedente
}

async function vistaMonitor() {
  const ev = window.__ev || (await api('/eventi')).find(e => e.attivo);
  $('#titolo').textContent = 'Monitor';
  const righe = await api(`/eventi/${ev.id}/monitor`);
  const sq = [...new Set(righe.map(r => r.squadra))];
  const schede = [...new Set(righe.map(r => `${r.scena}${r.slot}`))];
  const cella = (r) => !r.stato ? '·' : r.stato === 'bozza' ? `${r.voci_compilate}/${r.voci_totali}` : r.stato === 'completata' ? '✔' : '✔✔';
  $('#app').innerHTML = `<div class="card"><table><tr><th>Squadra</th>${schede.map(s => `<th>${esc(s)}</th>`).join('')}</tr>
    ${sq.map(n => `<tr><td>${n}</td>${schede.map(s => `<td>${cella(righe.find(r => r.squadra === n && `${r.scena}${r.slot}` === s))}</td>`).join('')}</tr>`).join('')}</table>
    <small>· non iniziata · n/m in compilazione · ✔ completata · ✔✔ verificata</small><br><a class="btn sec" href="#">Home</a></div>`;
}

async function route() {
  if (!token) { return location.hash === '#login' ? vistaLogin() : vistaPubblica(); }
  if (!coda) { try { await preparaCoda(); } catch (e) { $('#app').innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; } }
  const [v, a, b] = location.hash.slice(1).split('/');
  $('#app').classList.toggle('largo', v === 'valuta'); if (v !== 'valuta') $('#app').classList.remove('sola-lettura');
  try {
    if (v === 'valuta') return await vistaValuta(a, b);
    if (v === 'valutazione') return await vistaSelezione();
    if (v === 'classifica') { localStorage.setItem('tab', 'classifiche'); location.href = '/admin.html'; return; }
    if (v === 'monitor') return await vistaMonitor();
    return await vistaHome();
  } catch (e) { $('#app').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
addEventListener('hashchange', route); route();
</script>
</body>
