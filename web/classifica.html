<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classifica · GareCRI</title>
<link rel="stylesheet" href="stile.css"><link rel="stylesheet" href="mobile.css"><script src="mobile.js"></script>
<style>
  body.laterale main > *, body.laterale footer { max-width:none !important; margin-left:0 !important; margin-right:0 !important } body.laterale footer { margin-left:210px !important } @media (min-width:1100px) { body.laterale footer, body.laterale main { margin-right:210px !important } } body.laterale.schermo #lat, body.laterale.schermo #rail { display:none !important } body.laterale.schermo main, body.laterale.schermo footer { margin:0 !important }
  :root { --rosso:#C8102E; --scuro:#1b0f12; --oro:#F2C94C; --argento:#C9CED6; --bronzo:#D9985F; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; }
  body { font-family:var(--corpo); background:#F5F6F8; color:var(--inchiostro); display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:18px; padding:1.2vh 3vw; }
  header img { height:8vh; }
  header h1 { font-family:var(--titoli); margin:0; font-size:max(26px,4vh); line-height:1.1; } header p { margin:2px 0 0; font-size:max(14px,2.2vh); opacity:.9; }
  #ctrl { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; transition:opacity .4s; }
  #ctrl button, #ctrl a { font:inherit; font-size:14px; padding:7px 14px; }
  #ctrl .on { background:var(--rosso); color:#fff; border-color:var(--rosso); }
  body.quiet #ctrl { opacity:0; pointer-events:none; } body.quiet { cursor:none; }
  main { flex:1; min-height:0; padding:2vh 3vw; display:flex; flex-direction:column; gap:1.4vh; }
  .podio { display:flex; flex-direction:column; gap:1.2vh; }
  .p { display:flex; align-items:center; gap:2vw; border-radius:14px; padding:1.4vh 2vw; color:#1b1b1b; font-weight:700; }
  .p .pos, .p .nm, .p .pt { font-family:var(--titoli); } .p .pos { font-size:max(34px,6vh); width:1.4em; text-align:center; } .p .nm { flex:1; font-size:max(26px,5vh); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .p .pt { font-size:max(30px,5.6vh); } .p small { font-size:max(14px,2.4vh); font-weight:600; opacity:.75; margin-left:.4em; }
  .p1 { background:var(--oro); padding-block:2.2vh; } .p1 .nm { font-size:max(32px,6.4vh); } .p2 { background:var(--argento); } .p3 { background:var(--bronzo); }
  .resto { flex:1; min-height:0; overflow:hidden; columns:2; column-gap:3vw; font-size:max(16px,2.8vh); }
  .r { display:flex; gap:1.2vw; padding:.7vh 1vw; border-bottom:1px solid var(--bordo); break-inside:avoid; } .r .pos { width:2em; color:var(--rosso); font-weight:700; } .r .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .r .pt { font-weight:700; }
  .msg { margin:auto; font-size:max(20px,3vh); text-align:center; opacity:.85; } .msg a { color:var(--rosso); }
  footer { padding:0 3vw 1.4vh; font-size:max(12px,1.8vh); opacity:.6; display:flex; justify-content:space-between; }
</style></head><body>
<header><img src="/logo-cri.jpg" alt="CRI"><div><h1 id="t">Classifica</h1><p id="s"></p></div>
  <div id="ctrl"><span id="tipi"></span><button id="pt">Punti: sì</button><button id="fs">Schermo intero</button><a id="pdf" href="#">PDF</a><a href="/admin.html#classifiche">Chiudi</a></div></header>
<main id="m"><div class="msg">Caricamento…</div></main>
<footer><span id="ag"></span><span>Si aggiorna da solo ogni 20 secondi</span></footer>
<script src="barra.js"></script><script src="widget.js"></script><script src="layout.js"></script>
<script src="app-classifica.js"></script></body></html>
