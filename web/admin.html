<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = localStorage.getItem('token'), me = JSON.parse(localStorage.getItem('me') || 'null');
let eventi = [], ev = null, tab = 'menu', cache = {};
// due famiglie di eventi con aree di gestione separate: gare (gara, olimpiadi, allenamento) e corsi (corso, mega code, esame)
let fam = 'gara';
const FAM_TIPI = { gara: ['gara', 'olimpiadi', 'allenamento', 'corso_giudici'], corsi: ['corso', 'megacode', 'esame'], comune: ['gara', 'olimpiadi', 'allenamento', 'corso_giudici'] };
const VERS_NOME = { gara: 'Gara', olimpiadi: 'Olimpiadi', megacode: 'Mega Code' };
const NOME_TIPO = { corso_giudici: 'corso giudici', megacode: 'mega code' };
const eventiFam = () => eventi.filter((e) => FAM_TIPI[fam].includes(e.tipo));
const impostaFam = (f) => { fam = f; document.body.classList.toggle('corsi', f === 'corsi'); const s = localStorage.getItem('ev_' + fam), l = eventiFam(); ev = l.find((e) => e.id === s) || l.find((e) => e.attivo) || l[0] || null; };
const LIV = ['mb', 'be', 'su', 'in', 'ne'];

async function api(path, opt = {}) {
  const r = await fetch('/api' + path, { method: opt.method || (opt.body ? 'POST' : 'GET'),
    headers: { ...(opt.body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 403 && (await r.clone().json().catch(() => ({}))).errore === 'configura_mfa') { location.href = '/#sicurezza'; throw new Error('configura la MFA'); }
  if (r.status === 401 && !path.startsWith('/login') && !path.startsWith('/auth/')) { localStorage.removeItem('token'); localStorage.removeItem('me'); location.href = '/'; throw new Error('sessione scaduta'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.errore || r.statusText), { dettaglio: j.dettaglio });
  return j;
}
const flash = (testo, ok = true) => { const d = document.createElement('div'); d.className = 'msg ' + (ok ? 'ok' : 'err'); d.textContent = testo;
  document.body.append(d); setTimeout(() => d.remove(), ok ? 3000 : 8000); };

// Selettore del luogo: regione → provincia → comune (con ricerca). Le coordinate si ricavano dal comune scelto.
const htmlComune = (p) => `<div class="riga"><div><label>Regione</label><select id="${p}_reg"><option value="">—</option></select></div>
  <div><label>Provincia</label><select id="${p}_prov"><option value="">—</option></select></div>
  <div><label>Cerca il comune</label><input id="${p}_q" placeholder="scrivi il nome" autocomplete="off"></div>
  <div><label>Comune</label><select id="${p}_com"><option value="">— scegli regione, provincia o cerca —</option></select></div></div>`;
async function attivaComune(p, ini = {}) {
  const $r = $('#' + p + '_reg'), $p = $('#' + p + '_prov'), $q = $('#' + p + '_q'), $c = $('#' + p + '_com');
  const opt = (v, t, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(t)}</option>`;
  const caricaComuni = async (selIstat) => {
    const qs = new URLSearchParams({ regione: $r.value, provincia: $p.value, q: $q.value.trim(), limite: 300 });
    if (!$r.value && !$p.value && $q.value.trim().length < 2 && !selIstat) { $c.innerHTML = '<option value="">— scegli regione, provincia o cerca —</option>'; return; }
    const l = await api('/comuni?' + qs);
    $c.innerHTML = '<option value="">— scegli il comune —</option>' + l.map((c) => opt(c.istat, `${c.nome} (${c.sigla})${$r.value ? '' : ' · ' + c.regione}`, c.istat === selIstat)).join('');
    if (l.length === 1 && !selIstat) { $c.value = l[0].istat; $c.dispatchEvent(new Event('change')); }
  };
  const caricaProvince = async (selNome) => {
    const l = await api('/comuni/province?regione=' + encodeURIComponent($r.value));
    $p.innerHTML = '<option value="">—</option>' + l.map((x) => opt(x.sigla, x.nome, selNome && x.nome === selNome)).join('');
  };
  $r.innerHTML = '<option value="">—</option>' + (await api('/comuni/regioni')).map((x) => opt(x, x, x === ini.regione)).join('');
  await caricaProvince(ini.provincia);
  if (ini.istat) await caricaComuni(ini.istat);
  $r.onchange = async () => { await caricaProvince(); $q.value = ''; await caricaComuni(); };
  $p.onchange = async () => { $q.value = ''; await caricaComuni(); };
  let t; $q.oninput = () => { clearTimeout(t); t = setTimeout(() => caricaComuni().catch(() => {}), 250); };
  if (ini.onChange) $c.addEventListener('change', () => ini.onChange($c.value));
}
const fai = async (fn, okMsg) => { try { await fn(); await render(); if (okMsg) flash(okMsg); } catch (e) { flash(e.message, false); } };
// nella Formazione le squadre si chiamano equipaggi
const SOSTITUZIONI = [[/\btutte le squadre\b/g, 'tutti gli equipaggi'], [/\bdelle squadre\b/g, 'degli equipaggi'], [/\bdalle squadre\b/g, 'dagli equipaggi'], [/\balle squadre\b/g, 'agli equipaggi'], [/\b(L|l)e squadre\b/g, (m, a) => (a === 'L' ? 'Gli' : 'gli') + ' equipaggi'], [/\bSquadre \(1 attive\)/g, 'Equipaggi (1 attivo)'], [/\b(Nuova|nuova) squadra\b/g, (m, a) => (a === 'Nuova' ? 'Nuovo' : 'nuovo') + ' equipaggio'], [/\b(Una|una) squadra\b/g, (m, a) => (a === 'Una' ? 'Un' : 'un') + ' equipaggio'], [/\b(Una|una) o più squadre\b/g, (m, a) => (a === 'Una' ? 'Uno' : 'uno') + ' o più equipaggi'],
  [/\bSquadre \((\d+) attive\)/g, 'Equipaggi ($1 attivi)'], [/\bsquadre\b/g, 'equipaggi'], [/\bSquadre\b/g, 'Equipaggi'], [/\bsquadra\b/g, 'equipaggio'], [/\bSquadra\b/g, 'Equipaggio'], [/\bdella squadra\b/g, 'dell\'equipaggio']];
const inEquipaggi = (t) => SOSTITUZIONI.reduce((x, [r, n]) => x.replace(r, n), t);
function equipaggi(radice) {
  if (fam !== 'corsi' || !radice) return;
  const w = document.createTreeWalker(radice, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) { if (n.parentNode.closest('script,style')) continue; const v = inEquipaggi(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  radice.querySelectorAll('[placeholder],[title]').forEach((el) => { for (const a of ['placeholder', 'title']) if (el.hasAttribute(a)) el.setAttribute(a, inEquipaggi(el.getAttribute(a))); });
}
new MutationObserver(() => equipaggi(document.getElementById('dlg'))).observe(document.getElementById('dlg'), { childList: true, subtree: true });
const dlg = (html) => { $('#dlg').innerHTML = html; equipaggi($('#dlg')); $('#dlg').showModal(); };
const chiudi = () => $('#dlg').close();
window.chiudi = chiudi;

$('#esci').onclick = () => { localStorage.removeItem('token'); localStorage.removeItem('me'); location.href = '/'; };

const TABS = [['menu', 'Portale'], ['valutazione', 'Valutazione'], ['hub', 'Menu'], ['corsi', 'Corsi'], ['evento', 'Dati della gara'], ['discenti', 'Discenti'], ['scene', 'Scene'], ['risorse', 'Risorse'], ['squadre', 'Squadre'], ['segreteria', 'Arrivi e badge'], ['persone', 'Anagrafiche'], ['comitati', 'Comitati'], ['importa', 'Importa'],
  ['libreria', 'Libreria'], ['punteggi', 'Punteggi'], ['classifiche', 'Classifiche'], ['monitor', 'Monitor'], ['stampa', 'Stampa'], ['news', 'Notizie'], ['documenti', 'Documentazione'], ['richieste', 'Richieste'], ['ruoli', 'Ruoli e permessi'], ['utenti', 'Utenti']];
const AREA_TAB = { corsi: ['esami', 'gara'], risorse: 'scene', segreteria: 'segreteria', valutazione: 'valutazione', evento: 'gara', discenti: ['esami', 'gara'], scene: 'scene', libreria: ['schede', 'formazione_esame'], punteggi: 'schede', squadre: 'squadre', persone: 'anagrafiche', comitati: 'anagrafiche', news: 'notizie', documenti: 'documentazione', classifiche: 'classifiche', monitor: 'classifiche', stampa: 'stampa', importa: 'importa' };
const DESC = { valutazione: 'Inizia a valutare: scegli scena, scheda e squadra', discenti: 'Chi frequenta il corso: con loro si compongono gli equipaggi dei Mega Code', corsi: 'Corsi, Mega Code ed esami', evento: 'Date, luogo, tipo ed eventuale soglia', scene: 'Una scena è un gruppo di schede', risorse: 'Giudici, simulatori e truccatori per scena', squadre: 'Squadre, comitato e componenti',
  segreteria: 'Registra gli arrivi e stampa i badge', persone: 'Persone e requisiti', comitati: 'Elenco dei comitati, unità territoriali e nomi da correggere', importa: 'Carica le scene dai vecchi file Excel', libreria: 'Crea e modifica le schede, anche dei comitati', punteggi: 'Valore di MB, BE, SU, IN, NE per ogni scala',
  classifiche: 'Generale, SEP, BLSD, Master, DIU', monitor: 'Avanzamento delle schede', stampa: 'Schede vuote o compilate, per scena o squadra', news: 'Avvisi per i partecipanti e notizie pubbliche', documenti: 'Regolamento, comunicazioni e manuali',
  richieste: 'Chi ha chiesto l\'accesso: approva e assegna il ruolo', ruoli: 'Crea ruoli e scegli a quali aree possono accedere', utenti: 'Accessi, ruoli e gara assegnata' };
// tre mondi separati: si sceglie all'ingresso e dentro si vede solo ciò che li riguarda (il motore è lo stesso)
const GRUPPI = [['gara', 'Gare e Olimpiadi', 'Gare, allenamenti, scene, schede, squadre e classifiche', 'evento', ['valutazione', 'evento', 'scene', 'risorse', 'squadre', 'segreteria', 'libreria', 'punteggi', 'classifiche', 'monitor', 'stampa', 'importa', 'news', 'documenti']],
  ['corsi', 'Formazione', 'Corsi, Mega Code ed esami', 'corsi', ['valutazione', 'corsi', 'evento', 'discenti', 'scene', 'libreria', 'risorse', 'squadre', 'news']],
  ['comune', 'Gestione comune', 'Anagrafiche, comitati, utenti e ruoli', 'persone', ['persone', 'comitati', 'richieste', 'ruoli', 'utenti']]];
const SOLO_ADMIN = ['utenti', 'richieste', 'ruoli'];
const admin = () => me.ruolo === 'admin';
const consentito = (k) => k === 'menu' || k === 'hub' || (SOLO_ADMIN.includes(k) ? admin() : admin() || [].concat(AREA_TAB[k]).some((a) => (me.aree || []).includes(a)));
const mondoCorrente = () => GRUPPI.find((g) => g[0] === fam);
const gruppoDi = (k) => { const c = GRUPPI.filter((g) => g[4].includes(k)); return c.find((g) => g[0] === fam) || c[0]; };
const mondiVisibili = () => GRUPPI.filter((g) => figliVisibili(g).length);
const impostaMondo = (f) => { if (f === 'comune') { impostaFam('gara'); fam = 'comune'; document.body.classList.remove('corsi'); } else impostaFam(f); };
const haArea = (a) => admin() || (me.aree || []).includes(a);
// ogni mondo mostra solo le sezioni consentite: la Formazione richiede l'area Esami, i dati dell'evento l'area del proprio mondo
const figliVisibili = (g) => g[4].filter((k) => k === 'evento' ? haArea(g[0] === 'corsi' ? 'esami' : 'gara') : g[0] === 'corsi' ? haArea('esami') && consentito(k) : consentito(k));

  if (t !== 'menu' && t !== 'hub') { const m = GRUPPI.find((g) => g[0] === fam && g[4].includes(t)) || GRUPPI.find((g) => g[4].includes(t)); if (m && m[0] !== fam) impostaMondo(m[0]); }

function dialogCanovaccio(c) {
  const linee = (v) => (Array.isArray(v) ? v : []).join('\n');
  const ta = (id, et, v, righe = 3, nota = '') => `<label>${et}${nota ? ` <small>${nota}</small>` : ''}</label><textarea id="${id}" rows="${righe}" style="width:100%">${esc(v || '')}</textarea>`;

    dlg(`<h3>Nuovo canovaccio</h3><p>Di che tipo è?</p>
      <p><button class="b cv_t" data-v="megacode">Mega Code <small>(descrizione di uno scenario)</small></button> <button class="s cv_t" data-v="gara">Gara</button> <button class="s cv_t" data-v="olimpiadi">Olimpiadi</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
    document.querySelectorAll('.cv_t').forEach((b) => { b.onclick = () => modulo(b.dataset.v, null); });
  };
  const modulo = (v, esist) => {
    const d = esist?.dati || {}, mc = v === 'megacode';
    const sez = (t) => linee((d.sezioni || []).find((x) => x.tipo === t)?.blocchi?.map((b) => b.testo));
    dlg(`<h3>${esist ? 'Modifica' : 'Nuovo'} canovaccio · ${esc(VERS_NOME[v])}</h3>
      <div class="riga"><div class="stretto"><label>${mc ? 'Scenario (1-3 caratteri)' : 'Lettera della scena'}</label><input id="cn_c" maxlength="3" value="${esc(esist?.codice || '')}" style="text-transform:uppercase"></div>
        <div style="flex:3"><label>Titolo</label><input id="cn_t" value="${esc(esist?.titolo || '')}"></div>
        <div><label>Codice evento</label><input id="cn_g" placeholder="${mc ? 'es. MC-2026' : 'es. GPSER-2027'}" value="${esc(esist?.gara_codice || '')}"></div>
        <div class="stretto"><label>Minuti</label><input id="cn_m" type="number" min="1" max="600" value="${esist?.tempo_min || ''}" style="width:80px"></div></div>
      ${mc ? `${ta('cn_dispatch', 'Dispatch', d.dispatch, 3, '(informazioni dalla centrale)')}${ta('cn_scena', 'Scena', d.scena, 3, '(com\'è l\'ambiente, pericoli)')}${ta('cn_racconto', 'Racconto del paziente', d.racconto, 3)}
        ${ta('cn_ql', 'Quick look', linee(d.quick_look), 3, '(una voce per riga)')}
        <div class="riga">${['A', 'B', 'C', 'D', 'E'].map((k) => `<div>${ta('cn_ab' + k, k + ' · ' + ({ A: 'Vie aeree', B: 'Respiro', C: 'Circolo', D: 'Neurologico', E: 'Esposizione' })[k], d.abcde?.[k], 3)}</div>`).join('')}</div>
        <div class="riga">${['S', 'A', 'M', 'P', 'L', 'E'].map((k) => `<div>${ta('cn_sa' + k, k + ' · ' + ({ S: 'Sintomi', A: 'Allergie', M: 'Medicinali', P: 'Patologie', L: 'Ultimo pasto', E: 'Eventi' })[k], d.sample?.[k], 2)}</div>`).join('')}</div>
        ${ta('cn_opq', 'OPQRST', d.opqrst, 2)}${ta('cn_evo', 'Evoluzione', d.evoluzione, 3, '(cosa cambia dopo gli interventi)')}${ta('cn_dest', 'Destinazione', d.destinazione, 1, '(codice di trasporto, rendez-vous…)')}
        ${ta('cn_tru', 'Trucchi del simulatore', linee(d.trucchi), 3, '(uno per riga)')}${ta('cn_com', 'Comportamenti del simulatore', linee(d.comportamenti), 4, '(uno per riga)')}${ta('cn_pre', 'Presidi', linee(d.presidi), 3, '(uno per riga)')}${ta('cn_note', 'Note', d.note, 2)}`
      : `<div class="riga"><div><label>Sottotitolo</label><input id="cn_sub" value="${esc(d.sottotitolo || '')}"></div><div><label>Squadra</label><input id="cn_sq" value="${esc(d.squadra || '')}" placeholder="1 Team Leader + 4 soccorritori"></div></div>
        ${ta('cn_bri', 'Briefing per la squadra', sez('briefing'), 4, '(un paragrafo per riga)')}${ta('cn_des', 'Descrizione della scena', sez('descrizione'), 4)}${ta('cn_rec', 'Scena recitata', sez('scena_recitata'), 4)}
        ${ta('cn_log', 'Logistica', (d.logistica || []).map((x) => x.k + ': ' + x.v).join('\n'), 3, '(una riga per voce, es. «Simulatori: 2»)')}
        <p class="nota">Pazienti e triage si caricano importando il file .docx del canovaccio.</p>`}
      <p class="err" id="cn_e" hidden></p><p><button class="b" id="cn_ok">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
    const val = (id) => $('#' + id).value;
    $('#cn_ok').onclick = async () => {
      const dati = mc ? { dispatch: val('cn_dispatch'), scena: val('cn_scena'), racconto: val('cn_racconto'), quick_look: val('cn_ql'), abcde: Object.fromEntries(['A', 'B', 'C', 'D', 'E'].map((k) => [k, val('cn_ab' + k)])),
          sample: Object.fromEntries(['S', 'A', 'M', 'P', 'L', 'E'].map((k) => [k, val('cn_sa' + k)])), opqrst: val('cn_opq'), evoluzione: val('cn_evo'), destinazione: val('cn_dest'), trucchi: val('cn_tru'), comportamenti: val('cn_com'), presidi: val('cn_pre'), note: val('cn_note') }
        : { sottotitolo: val('cn_sub'), squadra: val('cn_sq'), briefing: val('cn_bri'), descrizione: val('cn_des'), scena_recitata: val('cn_rec'), logistica: val('cn_log') };
      const body = { versione: v, codice: val('cn_c'), titolo: val('cn_t'), gara_codice: val('cn_g'), tempo_min: val('cn_m'), dati };
      try { await api(esist ? `/canovacci/${esist.id}` : '/canovacci', { method: esist ? 'PUT' : 'POST', body }); chiudi(); await render(); flash('Canovaccio salvato'); }
      catch (e) { $('#cn_e').textContent = e.message; $('#cn_e').hidden = false; }
    };
  };
  if (c) modulo(c.versione, c); else scelta();
}

const RUOLI_MEGACODE = [['team leader', 'Team Leader'], ['autista', 'Autista'], ['barelliere', 'Barelliere']];

  const trainer = new Set(quals.filter((q) => q.ambito).map((q) => q.codice));

      <table>${lista.length ? lista.map((m, i) => `<tr><td>${esc(m.cognome)} ${esc(m.nome)}<br><small>${esc(m.comitato || '—')}${m.provincia ? ' (' + esc(m.provincia) + ')' : ''}</small> ${avvisoTrainer(m.qualifiche)}</td>

  const riga = (v) => `<tr data-o="${v.ordine}"><td><input class="vt" value="${esc(v.testo)}" style="width:100%"> <small>${esc(v.scala)}</small></td>${LIV.map((l) => `<td><input class="num" data-l="${l}" value="${v[l] ?? ''}"></td>`).join('')}

function attivaFiltri(id) {
  const val = (k) => document.getElementById(`${id}_${k}`)?.value || '';
  const applica = () => { const q = val('q').trim().toLowerCase(), g = val('g'), a = val('a'), t = val('t'), sm = Number(val('s') || 0); let n = 0;
    document.querySelectorAll(`#b_${id} tr[data-n]`).forEach((r) => { const ok = (!q || r.dataset.n.includes(q)) && (!g || (r.dataset.g || '-') === g) && (!a || r.dataset.a === a) && (!t || (r.dataset.t || '').split(' ').includes(t)) && (!sm || Number(r.dataset.s || 0) >= sm); r.hidden = !ok; if (ok) n++; });

const htmlConfronto = (cf) => {
  const r = cf.riepilogo, col = { aggiunta: '#e3f5e6', tolta: '#fde4e4', ritoccata: '#fff3cd' }, et = { aggiunta: 'aggiunta', tolta: 'tolta', ritoccata: 'ritoccata', uguale: '' };
  const NL = ['MB', 'BE', 'SU', 'IN', 'NE'], pt = (v) => (v || []).map((x) => x ?? '–').join('/');
  const peso = (x) => NL.map((n, i) => (x.pa[i] !== x.pb[i] ? `${n} ${x.pa[i] ?? '–'}→${x.pb[i] ?? '–'}` : '')).filter(Boolean).join(', ');
  const righe = cf.righe.filter((x) => x.tipo !== 'uguale' || x.punti || x.sezione);
  const leg = `<p class="nota" style="margin:4px 0"><span style="background:#fde4e4;padding:2px 8px;border-radius:4px">rosa: solo in A (a sinistra)</span> <span style="background:#e3f5e6;padding:2px 8px;border-radius:4px">verde: solo in B (a destra)</span> <span style="background:#fff3cd;padding:2px 8px;border-radius:4px">giallo: parole ritoccate</span> <span style="padding:2px 8px">senza colore: stessa voce, punteggi o sezione diversi</span></p>`;
  return `<p><b>${Math.round(cf.somiglianza * 100)}%</b> simili · ${r.uguali} uguali, ${r.ritoccate} ritoccate, ${r.aggiunte} aggiunte, ${r.tolte} tolte${r.punti ? ', ' + r.punti + ' con punteggi diversi' : ''}${r.ordine_diverso ? ' · <span class="tag">stesse voci in ordine diverso</span>' : ''}</p>${leg}
    ${righe.length ? `<table><tr><th style="background:#e8eefc">A · ${esc(cf.a?.nome || '')} <small>(rev. ${cf.a?.revisione ?? ''})</small></th><th style="background:#fdeede">B · ${esc(cf.b?.nome || '')} <small>(rev. ${cf.b?.revisione ?? ''})</small></th><th></th></tr>${righe.map((x) => `<tr style="background:${col[x.tipo] || '#fff'}"><td>${x.tipo === 'aggiunta' ? '<small style="color:#888">— non presente —</small>' : esc(x.a || '')}</td><td>${x.tipo === 'tolta' ? '<small style="color:#888">— non presente —</small>' : esc(x.b || x.a || '')}${x.punti ? `<br><small><b>peso cambiato:</b> ${peso(x)}</small>` : ''}${x.sezione ? `<br><small>sezione: ${esc(x.sezione_a)} → ${esc(x.sezione_b)}</small>` : ''}</td><td>${et[x.tipo] || (x.punti ? 'punteggi' : 'sezione')}</td></tr>`).join('')}</table>` : '<p class="nota">Nessuna riga diversa.</p>'}`;
};

// ───────── LIBRERIA ─────────
const categoriaDi = (p) => (p.categoria || p.nome.split(' · ')[0] || 'Altre').trim();
const GRAV = { rosso: '#c8102e', giallo: '#e0a800', verde: '#2e8b3d' };
const puntoGrav = (g) => (g ? `<span title="Gravità: ${g}" style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${GRAV[g]};vertical-align:middle;margin-right:4px"></span>` : '');
// raggruppa per categoria principale (e, senza duplicare la scheda, anche sotto la secondaria); le schede senza categoria stanno in «Da classificare»
function gruppiPatologie(pat) {
  const macro = cache.macro || [];
  const nome = (c) => macro.find((m) => m.codice === c)?.nome;
  const m = new Map();
  const aggiungi = (c, p) => { if (!m.has(c)) m.set(c, []); m.get(c).push(p); };
  for (const p of pat) {
    if (p.is_master) aggiungi('Schede Master', p);
    else if (p.macro && nome(p.macro)) { aggiungi(nome(p.macro), p); if (p.macro2 && nome(p.macro2)) aggiungi(nome(p.macro2), { ...p, _sec: true }); }
    else aggiungi('Da classificare', p);
  }
  const ordine = (c) => (c === 'Da classificare' ? 98 : c === 'Schede Master' ? 99 : (macro.find((x) => x.nome === c)?.priorita ?? 50));
  for (const l of m.values()) l.sort((a, b) => categoriaDi(a).localeCompare(categoriaDi(b), 'it') || a.nome.localeCompare(b.nome, 'it'));
  return [...m.entries()].sort((a, b) => ordine(a[0]) - ordine(b[0]));
}

  };

      <p><label style="font-size:14px;color:inherit"><input type="checkbox" id="im_val"> <strong>Sono file compilati</strong>: importa le <em>valutazioni</em> (le «x» dei giudici) nelle scene già presenti dell'evento scelto, una squadra per file</label></p>
      <p><label style="font-size:14px;color:inherit"><input type="checkbox" id="im_sost"> <strong>Sostituisci</strong> le scene già presenti: cancella le loro valutazioni e le reimporta dal file</label></p>
      <p><button class="b" id="im_go">Importa ${files.length} file</button></p>` : '';

    document.querySelectorAll('.ic_ev').forEach((sel) => { sel.onchange = () => { sel.closest('.scheda').querySelectorAll('.ic_nuovo').forEach((x) => { x.hidden = sel.value !== ''; }); }; });

        squadre: blocco.querySelector('.ic_sq').value, storico: blocco.querySelector('.ic_sto').checked } };
      if (!id && (!dest[t].evento.codice || !dest[t].evento.nome)) return flash('Per un nuovo evento servono codice e nome', false);
    }
    const sostituisci = $('#im_sost').checked, valutazioni = $('#im_val').checked;
    if (valutazioni && Object.values(dest).some((x) => !x.evento_id)) return flash('Per le valutazioni scegli un evento esistente che contiene già le scene', false);
    if (sostituisci && !confirm('Le scene già presenti, con le loro valutazioni, verranno cancellate e ricaricate dai file. Continuare?')) return;
    $('#im_go').disabled = true; document.querySelectorAll('.im_t, .ic_ev').forEach((x) => (x.disabled = true));
    let ok = 0, ko = 0;
    for (const [i, f] of files.entries()) {
      const cella = $(`#im_e${i}`); cella.innerHTML = '⏳ in corso…';
      try {
        const r = await api('/import/excel', { body: { dati: await aBase64(f.file), tipo: f.tipo, sostituisci, valutazioni, ...dest[f.tipo] } });
        cella.innerHTML = `<span class="tag ok">✓ scena ${esc(r.scenaCodice)}</span> ${esc(r.scenaTitolo)}<br><small>${r.schede} schede · ${r.voci} voci · ${r.squadre} squadre · ${r.risposte} valutazioni</small>
          ${r.avvisi.length ? '<br><small>⚠ ' + [...new Set(r.avvisi)].slice(0, 4).map(esc).join(' · ') + '</small>' : ''}`;
        ok++;
      } catch (e) { cella.innerHTML = `<span class="tag no">✗</span> ${esc(e.message)}`; ko++; }
    }
    await caricaEventi();
    flash(`Importazione terminata: ${ok} file importati${ko ? `, ${ko} non importati` : ''}`, ko === 0);
  };
  $('#im_f').onchange = () => { files = [...$('#im_f').files].sort((a, b) => a.name.localeCompare(b.name)).map((file) => ({ file, tipo: tipoDi(file) })); disegna(); };
}

const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const oraIt = (d) => new Date(d).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
async function pdfUrl(path) {
  const r = await fetch('/api' + path, { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.errore || r.statusText); }
  return URL.createObjectURL(await r.blob());
}
// anteprima del badge in una finestra, con scelta del formato e stampa
function anteprimaBadge(S, { iscritto, ambito = 'tutti', titolo }) {
  let url = null;
  const q = iscritto ? `iscritto=${iscritto}` : `ambito=${encodeURIComponent(ambito)}`;
  dlg(`<div style="min-width:min(840px,88vw)"><h3>${esc(titolo)}</h3><div class="riga"><div><label>Formato del badge</label><select id="bd_f">${S.formati.map((f) => `<option value="${f.id}" ${f.id === S.formato ? 'selected' : ''}>${esc(f.nome)}${f.sistema ? '' : ' (' + f.larghezza_mm + '×' + f.altezza_mm + ' mm)'}</option>`).join('')}</select></div>
    <div class="stretto"><button class="b" id="bd_p">Stampa</button> <button class="s" id="bd_o">Apri in una scheda</button> <button class="s" onclick="chiudi()">Chiudi</button></div></div>
    <iframe id="bd_if" title="Anteprima badge" style="width:100%;height:62vh;border:1px solid #ccc;margin-top:8px;background:#eee"></iframe></div>`);
  const carica = async () => {
    try { const nuovo = await pdfUrl(`/eventi/${ev.id}/badge.pdf?${q}&formato=${$('#bd_f').value}`); if (url) URL.revokeObjectURL(url); url = nuovo; $('#bd_if').src = url; }
    catch (e) { $('#bd_if').srcdoc = `<p style="font-family:sans-serif;color:#b00;padding:12px">${esc(e.message)}</p>`; }
  };
  $('#bd_f').onchange = () => { S.formato = $('#bd_f').value; api(`/eventi/${ev.id}/formato-badge`, { method: 'PUT', body: { formato_badge_id: S.formato } }).catch(() => {}); carica(); };
  $('#bd_p').onclick = () => { const f = $('#bd_if').contentWindow; f.focus(); f.print(); };
  $('#bd_o').onclick = () => { if (url) window.open(url, '_blank'); };
  carica();
}

async function dialogRisorseScena(R, sc, ruolo, etichetta) {

  const nomeScena = (id) => { const x = R.scene.find((q) => q.id === id); return x ? x.codice : ''; };
  dlg(`<h3>${etichetta} · scena ${esc(sc.codice)}</h3>${cand.length ? cand.map((p) => { const altre = p.scene.filter((i) => i !== sc.id);
      return `<label style="font-size:15px;color:inherit"><input type="checkbox" value="${p.id}" ${sc.risorse.includes(p.id) ? 'checked' : ''}> ${esc(p.cognome)} ${esc(p.nome)} <small>${esc(p.comitato || '')}${p.arrivato_at ? ' · arrivato' : ''}${altre.length ? ' · anche in scena ' + altre.map(nomeScena).join(', ') : ''}</small></label>`; }).join('')

    <p><button class="b" id="rs_ok">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
  $('#rs_ok').onclick = () => {
    // la lista della scena contiene sia simulatori sia truccatori: cambio solo quelli del ruolo scelto

    chiudi(); fai(() => api(`/scene/${sc.id}/risorse`, { method: 'PUT', body: { iscrizioni: [...altri, ...scelti] } }), 'Risorse salvate');

// giudici di una scheda scelti tra gli iscritti alla gara (Segreteria): chi è arrivato è in evidenza
async function dialogGiudiciRisorse(R, schedaId, ass) {
  const utenti = (await api('/giudici')).filter((u) => u.ruoli.includes('giudice'));
  const sel = new Set(ass.filter((a) => a.scheda_id === schedaId).map((a) => a.utente_id));
  const iscr = new Map(R.persone.filter((p) => p.utente_id).map((p) => [p.utente_id, p]));
  const dove = (uid) => R.scene.flatMap((sc) => sc.schede.filter((k) => k.id !== schedaId && k.giudici.some((g) => g.utente_id === uid)).map((k) => `${sc.codice} · ${k.titolo}`));
  const riga = (u) => { const p = iscr.get(u.id), altre = dove(u.id);
    return `<label style="font-size:15px;color:inherit"><input type="checkbox" value="${u.id}" ${sel.has(u.id) ? 'checked' : ''}> ${esc(u.nome)} <small>${p ? (p.arrivato_at ? 'arrivato' : 'iscritto, non ancora arrivato') : esc(u.email)}${altre.length ? ' · già su ' + esc(altre.join('; ')) : ''}</small></label>`; };
  const iscritti = utenti.filter((u) => iscr.has(u.id)), altri = utenti.filter((u) => !iscr.has(u.id));
  const senza = R.persone.filter((p) => ['giudice', 'giudice_master'].includes(p.ruolo) && !p.utente_id);
  dlg(`<h3>Giudici della scheda</h3>
    <p><b>Iscritti alla gara</b></p>${iscritti.length ? iscritti.map(riga).join('') : '<p class="nota">Nessun giudice iscritto con un account. Iscrivi i giudici dalla Segreteria e collegali a un utente.</p>'}
    ${senza.length ? `<p class="nota">Iscritti come giudici ma senza accesso:</p>${senza.map((p) => `<p style="margin:2px 0">${esc(p.cognome + ' ' + p.nome)} <button class="s p gs_acc" data-id="${p.id}">Crea accesso</button></p>`).join('')}` : ''}
    ${altri.length ? `<details style="margin-top:8px"><summary>Altri giudici non iscritti a questa gara (${altri.length})</summary>${altri.map(riga).join('')}</details>` : ''}
    <p><button class="b" id="gs_ok">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
  document.querySelectorAll('.gs_acc').forEach((b) => { b.onclick = () => { chiudi(); fai(() => api(`/iscrizioni/${b.dataset.id}/accesso`, { body: {} }), 'Accesso creato: vale per questa gara'); }; });
  $('#gs_ok').onclick = () => { const ids = [...document.querySelectorAll('#dlg input:checked')].map((i) => i.value); chiudi();
    fai(() => api(`/schede/${schedaId}/assegnazioni`, { method: 'PUT', body: { utenti: ids } }), 'Giudici assegnati'); };
}
async function tRisorse() {
  if (!ev) { $('#app').innerHTML = selettoreEvento() + '<div class="card">Crea prima una gara.</div>'; legaSelettore(); return; }
  const R = await api(`/eventi/${ev.id}/risorse`);
  const NOMI = { giudice: 'Giudici', giudice_master: 'Giudici master', simulatore: 'Simulatori', truccatore: 'Truccatori' };
  const corsi = fam === 'corsi';
  const chips = Object.entries(R.conteggi).filter(([k]) => !corsi || !['giudice', 'giudice_master'].includes(k)).map(([k, c]) => `<div class="tile-ris"><b>${c.assegnati}/${c.totale}</b><span>${NOMI[k]} assegnati</span><small>${c.arrivati} arrivati${c.senza_account ? ` · ${c.senza_account} senza account` : ''}</small></div>`).join('');
  const nomi = (ids) => ids.map((i) => R.persone.find((p) => p.id === i)).filter(Boolean);
  const scene = R.scene.map((sc) => {
    const sim = nomi(sc.risorse).filter((p) => p.ruolo === 'simulatore'), tru = nomi(sc.risorse).filter((p) => p.ruolo === 'truccatore');
    const lista = (l) => l.length ? l.map((p) => `${esc(p.cognome)} ${esc(p.nome)}`).join(', ') : '<em>nessuno</em>';
    return `<div class="card"><h3 style="margin:0">Scena ${esc(sc.codice)} · ${esc(sc.titolo)}</h3>
      ${corsi ? '' : `<p><b>Giudice master:</b> ${sc.master.length ? sc.master.map((m) => esc(m.nome)).join(', ') : '<em>da assegnare</em>'} <button class="s p rmas" data-id="${sc.id}">Modifica</button></p>
      <table>${sc.schede.map((k) => `<tr><td>${esc(k.titolo)}</td><td>${k.giudici.length ? k.giudici.map((g) => esc(g.nome)).join(', ') : '<em>nessun giudice</em>'}</td><td><button class="s p rg" data-id="${k.id}">Giudici</button></td></tr>`).join('') || '<tr><td><em>Nessuna scheda</em></td></tr>'}</table>`}
      <p><b>Simulatori:</b> ${lista(sim)} <button class="s p rs" data-id="${sc.id}" data-r="simulatore">Modifica</button></p>
      <p><b>Truccatori:</b> ${lista(tru)} <button class="s p rs" data-id="${sc.id}" data-r="truccatore">Modifica</button></p></div>`;
  }).join('');
  const liberi = R.persone.filter((p) => ['simulatore', 'truccatore'].includes(p.ruolo) && !p.scene.length);
  $('#app').innerHTML = selettoreEvento() + `<div class="card"><div class="chips-ris">${chips}</div>
    <p class="nota">Gli iscritti si registrano dalla Segreteria. ${corsi ? 'Qui si assegnano simulatori e truccatori alle scene.' : 'I giudici assegnati a una scheda trovano quella scheda già pronta quando aprono la Valutazione.'}</p>
    ${liberi.length ? `<p><b>Da assegnare a una scena:</b> ${liberi.map((p) => `${esc(p.cognome)} ${esc(p.nome)} <small>(${p.ruolo})</small>`).join(', ')}</p>` : ''}</div>${scene || '<div class="card">Nessuna scena in questa gara.</div>'}`;
  legaSelettore();
  const ass = R.scene.flatMap((sc) => sc.schede.flatMap((k) => k.giudici.map((g) => ({ scheda_id: k.id, utente_id: g.utente_id }))));
  document.querySelectorAll('.rg').forEach((b) => { b.onclick = () => dialogGiudiciRisorse(R, b.dataset.id, ass); });
  const mas = R.scene.flatMap((sc) => sc.master.map((m) => ({ scena_id: sc.id, utente_id: m.utente_id })));
  document.querySelectorAll('.rmas').forEach((b) => { b.onclick = () => apriMaster(b.dataset.id, mas); });
  document.querySelectorAll('.rs').forEach((b) => { b.onclick = () => dialogRisorseScena(R, R.scene.find((q) => q.id === b.dataset.id), b.dataset.r, b.dataset.r === 'simulatore' ? 'Simulatori' : 'Truccatori'); });
}

  <div class="card"><h3>Nuovo ruolo</h3><div class="riga"><div><label>Nome (es. Segreteria, Gestore news)</label><input id="nr_n"></div></div>
    <div class="aree">${Object.keys(aree).map((k) => casella({ aree: [], sistema: false }, k)).join('')}</div><p><button class="b" id="nr_ok">Crea ruolo</button></p></div>
  <div class="card"><h3>Qualifiche</h3><p><small>Titoli permanenti della persona (si assegnano dall'anagrafica). Da sole non danno accesso: l'accesso arriva dall'assegnazione a un evento. Locale = opera nel proprio comitato, nazionale = in tutta Italia.</small></p>
    <table>${quals.map((q) => `<tr><td>${esc(q.nome)}${q.ambito ? ` <span class="tag">${q.ambito}</span>` : ''}${q.sistema ? ' <span class="tag">di base</span>' : ''}</td><td><small>${q.persone} persone</small></td><td>${q.sistema ? '' : `<button class="x p qd" data-c="${q.codice}">Elimina</button>`}</td></tr>`).join('')}</table>
    <div class="riga"><div><label>Nuova qualifica</label><input id="nq_n"></div><div><label>Ambito</label><select id="nq_a"><option value="">nessuno</option><option value="locale">locale</option><option value="nazionale">nazionale</option></select></div><div class="stretto"><button class="b" id="nq_ok">Aggiungi</button></div></div></div>`;
  $('#nq_ok').onclick = () => { const n = $('#nq_n').value.trim(); if (!n) return alert('Scrivi il nome della qualifica'); fai(() => api('/qualifiche', { body: { nome: n, ambito: $('#nq_a').value || null } }), 'Qualifica aggiunta'); };
  document.querySelectorAll('.qd').forEach((b) => { b.onclick = () => { if (confirm('Eliminare la qualifica?')) fai(() => api(`/qualifiche/${b.dataset.c}`, { method: 'DELETE' }), 'Qualifica eliminata'); }; });
  const scelte = (el) => [...el.querySelectorAll('input[data-k]')].filter((i) => i.checked).map((i) => i.dataset.k);
  document.querySelectorAll('.rs').forEach((b) => { b.onclick = () => fai(() => api(`/ruoli/${b.closest('[data-c]').dataset.c}`, { method: 'PUT', body: { aree: scelte(b.closest('[data-c]')) } }), 'Permessi salvati'); });
  document.querySelectorAll('.rd').forEach((b) => { b.onclick = () => { if (confirm('Eliminare il ruolo?')) fai(() => api(`/ruoli/${b.closest('[data-c]').dataset.c}`, { method: 'DELETE' }), 'Ruolo eliminato'); }; });
  $('#nr_ok').onclick = () => { const n = $('#nr_n').value.trim(); if (!n) return alert('Scrivi il nome del ruolo'); fai(() => api('/ruoli', { body: { nome: n, aree: scelte($('#nr_ok').closest('.card')) } }), 'Ruolo creato'); };
}

  if (tab === 'menu') {
    r.innerHTML = '<img class="logo-r" src="/logo-cri.jpg" alt=""><div class="w" id="rail_av" hidden><h4>Avvisi</h4></div><div class="w"><h4>Scorciatoie</h4><a href="/#valutazione">Valutazione</a><a href="/#monitor">Monitor</a><a href="/#documenti">Documentazione</a></div>';
    api('/avvisi').then((av) => { if (av.length && $('#rail_av')) { $('#rail_av').hidden = false; $('#rail_av').insertAdjacentHTML('beforeend', av.slice(0, 3).map((a) => `<div style="padding:6px 0;border-top:1px solid #e3e5ea"><b>${esc(a.titolo)}</b><small style="display:block">${esc((a.testo || '').slice(0, 90))}</small></div>`).join('')); } }).catch(() => {});
    return;
  }
  if (fam === 'comune' || !ev) {
    r.innerHTML = '<img class="logo-r" src="/logo-cri.jpg" alt=""><div class="w" id="rail_ri" hidden><h4>Da approvare</h4><b class="n"></b><a href="#" data-v="richieste">Apri le richieste</a></div>';
    r.querySelectorAll('[data-v]').forEach((a) => { a.onclick = (e) => { e.preventDefault(); vai(a.dataset.v); }; });
    if (me.ruolo === 'admin') api('/richieste/conteggio').then((c) => { if (c.n && $('#rail_ri')) { $('#rail_ri').hidden = false; $('#rail_ri b').textContent = c.n + (c.n === 1 ? ' richiesta di accesso' : ' richieste di accesso'); } }).catch(() => {});
    return;
  }
  const link = (t, k) => `<a href="#" data-v="${k}">${t}</a>`;
  r.innerHTML = `<img class="logo-r" src="/logo-cri.jpg" alt=""><div class="w"><h4>${fam === 'corsi' ? 'Evento scelto' : 'Gara scelta'}</h4><b class="n">${esc(ev.nome)}</b><small>${esc([dataIt(ev.data), ev.luogo].filter(Boolean).join(' · ') || 'data e luogo da indicare')}</small>${ev.attivo ? '<br><span class="tag ok">attivo</span>' : ''}</div>
    <div class="w" id="rail_av"><h4>Avanzamento</h4><small>Carico…</small></div>
    <div class="w"><h4>Scorciatoie</h4>${link('Scene', 'scene')}${link('Squadre', 'squadre')}${link('Classifiche', 'classifiche')}${link('Monitor', 'monitor')}</div>`;
  r.querySelectorAll('[data-v]').forEach((a) => { a.onclick = (e) => { e.preventDefault(); vai(a.dataset.v); }; });
  if (fam === 'corsi') { $('#rail_av').remove(); return; }
  const id = ev.id;
  try {
    const d = await api(`/eventi/${id}/avanzamento`); if (ev.id !== id || !$('#rail_av')) return;
    const gioco = d.scene.filter((x) => !x.sosta), tot = gioco.length * d.squadre.length;
    const fatte = d.squadre.reduce((n, q) => n + gioco.filter((sc) => d.celle[q.numero]?.[sc.codice]?.stato === 'fatta').length, 0);
    $('#rail_av').innerHTML = `<h4>Avanzamento</h4><b class="n">${d.squadre.length} squadre</b><small>${gioco.length} scene${d.scene.length > gioco.length ? ' + ' + (d.scene.length - gioco.length) + ' soste' : ''}</small>
      <div class="barra"><i style="width:${tot ? Math.round(100 * fatte / tot) : 0}%"></i></div><small>${fatte} di ${tot} scene fatte</small>`;
  } catch { if ($('#rail_av')) $('#rail_av').remove(); }
}
