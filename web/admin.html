<!doctype html>
<html lang="it">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GareCRI – Gestione</title>
<style>
  :root { --rosso:#E3001B; --bg:#f4f4f6; --card:#fff; --testo:#1c1c1e; --bordo:#d6d6da; --grigio:#e7e6e6; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px system-ui, sans-serif; background:var(--bg); color:var(--testo); }
  header { background:var(--rosso); color:#fff; padding:8px 12px; display:flex; gap:10px; align-items:center; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; white-space:nowrap; }
  header a, header button { background:#fff3; color:#fff; border:0; padding:8px 12px; border-radius:8px; font-size:14px; text-decoration:none; }
  nav { display:flex; gap:4px; overflow-x:auto; background:#fff; padding:6px 8px; border-bottom:1px solid var(--bordo); position:sticky; top:49px; z-index:4; }
  nav button { border:0; background:none; padding:10px 14px; border-radius:8px; font-size:15px; white-space:nowrap; }
  nav button.on { background:var(--rosso); color:#fff; }
  main { max-width:1000px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px #0001; }
  .card h3 { margin:0 0 8px; font-size:16px; }
  label { display:block; font-size:12px; color:#666; margin:8px 0 3px; }
  input, select, textarea { width:100%; padding:10px; font-size:15px; border:1px solid var(--bordo); border-radius:8px; background:#fff; font-family:inherit; }
  input[type=checkbox] { width:auto; }
  .riga { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; } .riga > * { flex:1 1 140px; }
  .riga > .stretto { flex:0 0 auto; }
  button.b { background:var(--rosso); color:#fff; border:0; padding:10px 14px; border-radius:8px; font-size:14px; cursor:pointer; }
  button.s { background:#555; color:#fff; border:0; padding:10px 14px; border-radius:8px; font-size:14px; cursor:pointer; }
  button.x { background:none; color:#C62828; border:1px solid #C62828; padding:8px 10px; border-radius:8px; cursor:pointer; }
  button.p { padding:6px 10px; font-size:13px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:var(--grigio); margin-left:4px; }
  .tag.ok { background:#d9f0dc; color:#1b5e20; } .tag.no { background:#fde0e0; color:#a00; }
  table { width:100%; border-collapse:collapse; } td, th { padding:7px 5px; border-bottom:1px solid var(--bordo); text-align:left; vertical-align:middle; }
  .scheda { border:1px solid var(--bordo); border-radius:10px; padding:10px; margin-top:8px; }
  .msg { padding:10px 12px; border-radius:8px; margin-bottom:10px; position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:50; max-width:min(560px,92vw); box-shadow:0 6px 20px #0004; font-weight:700; } .msg.err { background:#fde0e0; color:#a00; } .msg.ok { background:#d9f0dc; color:#1b5e20; }
  dialog { border:0; border-radius:14px; padding:16px; width:min(96vw, 900px); max-height:92vh; box-shadow:0 8px 30px #0005; }
  dialog::backdrop { background:#0006; }
  .voci td input, .voci td select { padding:6px; font-size:14px; }
  .num { width:56px !important; text-align:center; }
  table.punteggi { table-layout:fixed; }
  table.punteggi th, table.punteggi td { text-align:center; padding:6px 2px; }
  table.punteggi th:first-child, table.punteggi td:first-child { text-align:left; }
  table.punteggi .num { width:100% !important; max-width:56px; margin:0 auto; display:block; }
  table.punteggi input[type=checkbox] { display:block; margin:0 auto; }
  .griglia { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; }
  #tabs[hidden] { display:none !important; }
  header .logo { height:34px; background:#fff; border-radius:8px; padding:2px 4px; }
  .navbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; } .navbar a, .navbar button { background:#fff; color:#222; border:1px solid var(--bordo); padding:10px 14px; border-radius:10px; font-size:14px; text-decoration:none; cursor:pointer; font-family:inherit; }
  .navbar .val { background:var(--rosso); color:#fff; border-color:var(--rosso); }
  small, .nota { color:#666; font-size:12px; }
  .hub { grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .hubb { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; background:#fff; border:2px solid var(--bordo); border-radius:18px; padding:26px 14px; cursor:pointer; font-family:inherit; min-height:190px; }
  .hubb .ico { width:72px; height:72px; color:var(--rosso); background:#fdecee; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .aree { display:flex; flex-wrap:wrap; gap:6px 18px; margin:8px 0; } .ar { font-size:15px; color:inherit; display:flex; align-items:center; gap:6px; }
  .contatore { display:flex; align-items:center; gap:18px; flex-wrap:wrap; } .contatore .grande { font-size:38px; color:var(--rosso); } .barra { flex:1; min-width:140px; height:12px; background:#eee; border-radius:6px; overflow:hidden; } .barra i { display:block; height:100%; background:#2E7D32; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } table.sg tr.arr td { background:#f3faf3; } .ris { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chips-ris { display:flex; flex-wrap:wrap; gap:10px; } .tile-ris { flex:1; min-width:150px; background:#f6f6f6; border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; } .tile-ris b { font-size:26px; color:var(--rosso); }
  .dove { font-size:15px; margin:2px 0 8px; color:#555; } .dove a { color:var(--rosso); text-decoration:none; font-weight:600; } .dove b { color:#222; }
  table.lib { table-layout:fixed; } table.lib td { vertical-align:top; } .evt { display:block; font-size:12px; color:#777; margin-top:2px; }
  .hubb { position:relative; } .hubb .badge { position:absolute; top:10px; right:12px; background:#C62828; color:#fff; font-style:normal; font-weight:700; border-radius:999px; min-width:26px; padding:2px 8px; font-size:14px; }
  .hubb .ico svg { width:44px; height:44px; }
  .hubb b { font-size:21px; color:#222; } .hubb span { font-size:13px; color:#555; }
  .hubb:hover, .hubb:active { border-color:var(--rosso); box-shadow:0 4px 14px #0002; }
  .b-link { color:#555; }
  details.grp { border:1px solid var(--bordo); border-radius:10px; margin-top:8px; padding:4px 10px; } details.grp summary { cursor:pointer; padding:8px 0; }
  @media (max-width:640px) { .voci { font-size:13px; } }
</style>

<body>
<script src="comitati.js"></script>
<header><img class="logo" src="/logo-cri.jpg" alt="CRI"><h1>GareCRI · Gestione</h1><span id="chi"></span><a href="/#sicurezza">Sicurezza</a><button id="esci">Esci</button></header>
<nav id="tabs" hidden></nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = localStorage.getItem('token'), me = JSON.parse(localStorage.getItem('me') || 'null');
let eventi = [], ev = null, tab = 'menu', cache = {};
const LIV = ['mb', 'be', 'su', 'in', 'ne'];

async function api(path, opt = {}) {
  const r = await fetch('/api' + path, { method: opt.method || (opt.body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 403 && (await r.clone().json().catch(() => ({}))).errore === 'configura_mfa') { location.href = '/#sicurezza'; throw new Error('configura la MFA'); }
  if (r.status === 401 && !path.startsWith('/login') && !path.startsWith('/auth/')) { localStorage.removeItem('token'); localStorage.removeItem('me'); location.href = '/'; throw new Error('sessione scaduta'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.errore || r.statusText);
  return j;
}
const flash = (testo, ok = true) => { const d = document.createElement('div'); d.className = 'msg ' + (ok ? 'ok' : 'err'); d.textContent = testo;
  document.body.append(d); setTimeout(() => d.remove(), ok ? 3000 : 8000); };
const fai = async (fn, okMsg) => { try { await fn(); await render(); if (okMsg) flash(okMsg); } catch (e) { flash(e.message, false); } };
const dlg = (html) => { $('#dlg').innerHTML = html; $('#dlg').showModal(); };
const chiudi = () => $('#dlg').close();
window.chiudi = chiudi;

$('#esci').onclick = () => { localStorage.removeItem('token'); localStorage.removeItem('me'); location.href = '/'; };

const TABS = [['menu', 'Gestione'], ['evento', 'Dati della gara'], ['scene', 'Scene'], ['risorse', 'Risorse'], ['squadre', 'Squadre'], ['segreteria', 'Arrivi e badge'], ['persone', 'Anagrafiche'], ['comitati', 'Comitati'], ['importa', 'Importa'],
  ['libreria', 'Libreria'], ['punteggi', 'Punteggi'], ['classifiche', 'Classifiche'], ['monitor', 'Monitor'], ['stampa', 'Stampa'], ['news', 'Notizie'], ['documenti', 'Documentazione'], ['richieste', 'Richieste'], ['ruoli', 'Ruoli e permessi'], ['utenti', 'Utenti']];
const AREA_TAB = { risorse: 'scene', segreteria: 'segreteria', evento: 'gara', scene: 'scene', libreria: ['schede', 'formazione_esame'], punteggi: 'schede', squadre: 'squadre', persone: 'anagrafiche', comitati: 'anagrafiche', news: 'notizie', documenti: 'documentazione', classifiche: 'classifiche', monitor: 'classifiche', stampa: 'stampa', importa: 'importa' };
const DESC = { evento: 'Date, luogo, tipo ed eventuale soglia', scene: 'Una scena è un gruppo di schede', risorse: 'Giudici, simulatori e truccatori per scena', squadre: 'Squadre, comitato e componenti',
  segreteria: 'Registra gli arrivi e stampa i badge', persone: 'Persone e requisiti', comitati: 'Elenco dei comitati, unità territoriali e nomi da correggere', importa: 'Carica le scene dai vecchi file Excel', libreria: 'Crea e modifica le schede, anche dei comitati', punteggi: 'Valore di MB, BE, SU, IN, NE per ogni scala',
  classifiche: 'Generale, SEP, BLSD, Master, DIU', monitor: 'Avanzamento delle schede', stampa: 'Schede vuote o compilate, per scena o squadra', news: 'Avvisi per i partecipanti e notizie pubbliche', documenti: 'Regolamento, comunicazioni e manuali',
  richieste: 'Chi ha chiesto l\'accesso: approva e assegna il ruolo', ruoli: 'Crea ruoli e scegli a quali aree possono accedere', utenti: 'Accessi, ruoli e gara assegnata' };
// i contenitori della Gestione: il menu iniziale ne mostra cinque, le sottosezioni sono linguette dentro
const GRUPPI = [['gara', 'Gara', 'Dati, scene, risorse e squadre', 'evento', ['evento', 'scene', 'risorse', 'squadre']],
  ['segr', 'Segreteria', 'Arrivi e badge, anagrafiche, comitati, importa', 'segreteria', ['segreteria', 'persone', 'comitati', 'importa']],
  ['sch', 'Schede', 'Libreria, punteggi, schede dei comitati', 'libreria', ['libreria', 'punteggi']],
  ['ris', 'Risultati', 'Classifiche, monitor, stampa', 'classifiche', ['classifiche', 'monitor', 'stampa']],
  ['amm', 'Amministrazione', 'Notizie, documenti, utenti, ruoli, richieste', 'utenti', ['news', 'documenti', 'richieste', 'ruoli', 'utenti']]];
const SOLO_ADMIN = ['utenti', 'richieste', 'ruoli'];
const admin = () => me.ruolo === 'admin';
const consentito = (k) => k === 'menu' || (SOLO_ADMIN.includes(k) ? admin() : admin() || [].concat(AREA_TAB[k]).some((a) => (me.aree || []).includes(a)));
const gruppoDi = (k) => GRUPPI.find((g) => g[4].includes(k));
const figliVisibili = (g) => g[4].filter(consentito);
const nomeTab = (k) => TABS.find(([x]) => x === k)?.[1] || '';
let ELENCO_RUOLI = [];
window.addEventListener('hashchange', () => { const h = location.hash.slice(1) || 'menu'; if (TABS.some(([k]) => k === h) && consentito(h) && h !== tab) { tab = h; disegnaTabs(); render(); } });
const vai = (t) => { if (t === 'monitor') { location.href = '/#monitor'; return; } tab = t; history.replaceState(null, '', t === 'menu' ? location.pathname : '#' + t); disegnaTabs(); render(); };
function disegnaTabs() {
  if (!TABS.some(([k]) => k === tab)) tab = 'menu';
  const g = gruppoDi(tab), vis = g ? figliVisibili(g) : [];
  $('#tabs').hidden = vis.length < 2;               // le linguette servono solo dentro un contenitore con più sezioni
  $('#tabs').innerHTML = vis.map((k) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${nomeTab(k)}</button>`).join('');
  $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { vai(b.dataset.t); } };
}

async function caricaEventi() {
  eventi = await api('/eventi');
  const salvato = localStorage.getItem('ev');
  ev = eventi.find((e) => e.id === salvato) || eventi.find((e) => e.attivo) || eventi[0] || null;
}
const selettoreEvento = () => `<div class="card"><label>Gara</label><div class="riga">
  <select id="selev">${eventi.map((e) => `<option value="${e.id}" ${ev && e.id === ev.id ? 'selected' : ''}>${esc(e.codice)} – ${esc(e.nome)}${e.attivo ? ' (attivo)' : ''}</option>`).join('')}</select></div></div>`;
const legaSelettore = () => { const s = $('#selev'); if (s) s.onchange = () => { ev = eventi.find((e) => e.id === s.value); localStorage.setItem('ev', ev.id); render(); }; };

// ───────── EVENTO ─────────
async function tEvento() {
  $('#app').innerHTML = selettoreEvento() + (ev ? `
  <div class="card"><h3>Dati della gara ${ev.attivo ? '<span class="tag ok">attivo</span>' : ''}</h3>
    <div class="riga"><div><label>Codice</label><input id="e_cod" value="${esc(ev.codice)}"></div><div><label>Nome</label><input id="e_nome" value="${esc(ev.nome)}"></div>
      <div><label>Titolo in stampa</label><input id="e_tit" value="${esc(ev.titolo_stampa || '')}"></div></div>
    <div class="riga"><div><label>Luogo</label><input id="e_luogo" value="${esc(ev.luogo || '')}"></div>
      <div><label>Data</label><input id="e_data" type="date" value="${esc(ev.data || '')}"></div>
      <div><label>Tipo</label><select id="e_tipo">${['gara', 'olimpiadi', 'allenamento', 'corso', 'esame', 'megacode'].map((t) => `<option ${ev.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>
    <div class="riga"><div><label>Soglia di superamento (%) — vuota se non serve</label><input id="e_soglia" type="number" min="1" max="100" value="${esc(ev.soglia_pct ?? '')}"></div>
      <div><label style="display:block">Punteggi ai giudici</label><label style="font-size:15px;color:inherit"><input type="checkbox" id="e_mp" ${ev.mostra_punteggi ? 'checked' : ''}> mostra punti e percentuale mentre compilano (esami, corsi, allenamenti)</label></div></div>
    <p><button class="b" id="e_salva">Salva</button> <button class="s" id="e_attiva" ${ev.attivo ? 'disabled' : ''}>Rendi attivo</button>
    <button class="x" id="e_arch">Archivia</button></p></div>
  <div class="card"><h3>Mappa del percorso</h3><label>Incorporamento Google My Maps (facoltativo)</label>
    <input id="e_map" value="${esc(ev.mappa_url || '')}" placeholder="https://www.google.com/maps/d/embed?mid=…">
    <p class="nota">Crea la mappa su Google My Maps con i punti delle scene, poi Condividi → Incorpora mappa e incolla qui solo l'indirizzo (src). Gli indirizzi o le coordinate delle singole scene si inseriscono in Scene.</p>
    <p><button class="b" id="e_map_ok">Salva mappa</button></p></div>` : '') + `
  <div class="card"><h3>Nuova gara</h3><div class="riga">
    <div><label>Nome</label><input id="n_nome" placeholder="GPSER 2027"></div><div><label>Codice (se vuoto, ricavato dal nome)</label><input id="n_cod" placeholder="GPSER-2027"></div>
    <div><label>Tipo</label><select id="n_tipo"><option value="gara">gara</option><option value="olimpiadi">olimpiadi</option><option value="allenamento">allenamento</option><option value="corso">corso</option><option value="megacode">mega code (formativo)</option><option value="esame">esame (soglia 75%)</option></select></div>
    <div><label>Luogo</label><input id="n_luogo"></div><div><label>Data</label><input id="n_data" type="date"></div></div>
    <p><button class="b" id="n_crea">Crea evento</button></p></div>`;
  if (me.ruolo === 'admin') api('/richieste/conteggio').then((c) => { const b = document.querySelector('.hubb[data-t=richieste]'); if (b && c.n) b.insertAdjacentHTML('afterbegin', `<em class="badge">${c.n}</em>`); }).catch(() => {});
  legaSelettore();
  if (ev) {
    $('#e_salva').onclick = () => fai(() => api(`/eventi/${ev.id}`, { method: 'PATCH', body: { codice: $('#e_cod').value.trim(), nome: $('#e_nome').value, titolo_stampa: $('#e_tit').value,
      luogo: $('#e_luogo').value, data: $('#e_data').value || null, tipo: $('#e_tipo').value, soglia_pct: $('#e_soglia').value, mostra_punteggi: $('#e_mp').checked } }).then(caricaEventi), 'Salvato');
    $('#e_attiva').onclick = () => fai(() => api(`/eventi/${ev.id}/attiva`, { method: 'POST', body: {} }).then(caricaEventi), 'Evento attivato');
    $('#e_arch').onclick = () => { if (confirm('Archiviare questo evento? Sparisce dagli elenchi ma i dati restano.')) fai(() => api(`/eventi/${ev.id}`, { method: 'PATCH', body: { archiviato: true } }).then(caricaEventi), 'Archiviato'); };
    $('#e_map_ok').onclick = () => fai(() => api(`/eventi/${ev.id}`, { method: 'PATCH', body: { mappa_url: $('#e_map').value.trim() } }).then(caricaEventi), 'Mappa salvata');
  }
  $('#n_crea').onclick = () => fai(async () => {
    const e = await api('/eventi', { body: { codice: $('#n_cod').value.trim() || $('#n_nome').value.trim().toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-|-$/g, ''), tipo: $('#n_tipo').value, nome: $('#n_nome').value.trim(), titolo_stampa: $('#n_nome').value.trim(), luogo: $('#n_luogo').value, data: $('#n_data').value || null } });
    await caricaEventi(); ev = eventi.find((x) => x.id === e.id) || ev; localStorage.setItem('ev', ev.id);
  }, 'Gara creata');
}

function tMenu() {
  const tile = ([k, nome, desc, icona, figli]) => { const v = figli.filter(consentito); if (!v.length) return '';
    // un solo accesso (es. chi gestisce soltanto le notizie): il riquadro porta direttamente lì, con il nome della sezione
    return v.length === 1 ? `<button class="hubb" data-t="${v[0]}"><i class="ico">${ICONE[v[0]] || ICONE[icona]}</i><b>${esc(nomeTab(v[0]))}</b><span>${esc(DESC[v[0]] || '')}</span></button>`
      : `<button class="hubb" data-t="${v[0]}"><i class="ico">${ICONE[icona]}</i><b>${nome}</b><span>${desc}</span></button>`; };
  $('#app').innerHTML = selettoreEvento() + `<div class="griglia hub">${GRUPPI.map(tile).join('')}</div>`;
  legaSelettore();
  document.querySelectorAll('.hubb').forEach((b) => { b.onclick = () => vai(b.dataset.t); });
}

// ───────── CLASSIFICHE ─────────
const CLASSIFICHE = [['generale', 'Generale', 'totale'], ['sep', 'SEP', 'sep'], ['bls', 'BLSD', 'bls'], ['master', 'Master', 'master'], ['diu', 'DIU', 'diu']];
async function tClassifiche() {
  if (!ev) { $('#app').innerHTML = selettoreEvento() + '<div class="card">Crea prima una gara.</div>'; return; }
  const q = localStorage.getItem('clsTipo') || 'generale';
  const [nome, , campo] = CLASSIFICHE.find(([k]) => k === q) || CLASSIFICHE[0];
  const r = await api(`/eventi/${ev.id}/classifica?tipo=${q}`);
  const max = q === 'generale' ? r.massimi?.max_totale : q === 'sep' ? r.massimi?.max_sep : null;
  const valore = (c) => Number(q === 'generale' ? c.totale : c[campo]);
  $('#app').innerHTML = selettoreEvento() + `<div class="card"><div class="riga" style="gap:6px">${CLASSIFICHE.map(([k, n]) => `<button class="${k === q ? 'b' : 's'} cl" data-k="${k}" style="flex:0 0 auto">${n}</button>`).join('')}</div>
    <p style="margin:10px 0 0"><a class="b" style="display:inline-block;text-decoration:none;padding:9px 14px;border-radius:8px" target="_blank" href="/classifica.html?ev=${ev.id}&tipo=${q}">Proietta a schermo intero</a> <button class="s" id="cl_pdf">PDF</button></p>
    <h3 style="margin-top:12px">Classifica ${esc(nome)}</h3>
    <table><tr><th>#</th><th>Squadra</th><th style="text-align:right">Punti</th>${max ? '<th style="text-align:right">%</th>' : ''}</tr>
    ${r.classifica.map((c) => `<tr><td>${c.posizione}</td><td>${esc(c.nome)}</td><td style="text-align:right"><b>${valore(c)}</b></td>${max ? `<td style="text-align:right">${(valore(c) / max * 100).toFixed(1)}%</td>` : ''}</tr>`).join('')}</table>
    ${max ? `<p class="nota">Massimo teorico: ${max}</p>` : ''}
    <p class="nota">${{ generale: 'Tutte le voci di tutte le schede.', sep: 'Solo le voci contrassegnate SEP.', bls: 'Solo le schede contrassegnate BLS/BLSD.', master: 'Solo le schede Master.', diu: 'Solo le schede contrassegnate DIU.' }[q]}</p></div>`;
  legaSelettore();
  document.querySelectorAll('.cl').forEach((b) => { b.onclick = () => { localStorage.setItem('clsTipo', b.dataset.k); render(); }; });
  $('#cl_pdf').onclick = async () => { try { window.open(await pdfUrl(`/eventi/${ev.id}/classifica.pdf?tipo=${q}`), '_blank'); } catch (e) { flash(e.message, false); } };
}

// ───────── STAMPA ─────────
async function tStampa() {
  if (!ev) { $('#app').innerHTML = selettoreEvento() + '<div class="card">Crea prima una gara.</div>'; return; }
  const [scene, squadre] = await Promise.all([api(`/eventi/${ev.id}/scene`), api(`/eventi/${ev.id}/squadre`)]);
  const att = squadre.filter((x) => x.attiva);
  $('#app').innerHTML = selettoreEvento() + `<div class="card"><h3>Cosa vuoi stampare</h3>
    <div class="riga"><div><label>Schede</label><select id="p_v"><option value="1">Vuote (da compilare a mano)</option><option value="0">Compilate</option></select></div>
    <div><label>Per</label><select id="p_per"><option value="tutte">Tutte</option><option value="scena">Una scena</option><option value="squadra">Una o più squadre</option></select></div></div>
    <div id="p_sc_box" hidden><label>Scena</label><select id="p_sc">${scene.map((s) => `<option value="${esc(s.codice)}">${esc(s.codice)} – ${esc(s.titolo)}</option>`).join('')}</select></div>
    <div id="p_sq_box" hidden><label>Squadre</label>${att.map((x) => `<label style="font-size:15px;color:inherit;display:inline-block;margin-right:14px"><input type="checkbox" class="p_sq" value="${x.numero}"> ${x.numero} – ${esc(x.nome)}</label>`).join('')}</div>
    <p><button class="b" id="p_go">Apri PDF</button></p>
    <p class="nota">Il PDF ha una pagina per scheda, ordinate squadra → scena → scheda.</p></div>`;
  legaSelettore();
  const mostra = () => { $('#p_sc_box').hidden = $('#p_per').value !== 'scena'; $('#p_sq_box').hidden = $('#p_per').value !== 'squadra'; };
  $('#p_per').onchange = mostra; mostra();
  $('#p_go').onclick = async () => { const q = new URLSearchParams({ vuote: $('#p_v').value });
    if ($('#p_per').value === 'scena') q.set('scena', $('#p_sc').value);
    if ($('#p_per').value === 'squadra') { const n = [...document.querySelectorAll('.p_sq:checked')].map((i) => i.value); if (!n.length) return flash('Scegli almeno una squadra', false); q.set('squadra', n.join(',')); }
    const w = window.open('', '_blank');   // PDF scaricato con Authorization: nessun token nell'indirizzo
    try { const r = await fetch(`/api/eventi/${ev.id}/stampa.pdf?${q}`, { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).errore || r.statusText); w.location = URL.createObjectURL(await r.blob());
    } catch (e) { w.close(); flash(e.message, false); } };
}

async function tSquadre() {
  if (!ev) { $('#app').innerHTML = selettoreEvento() + '<div class="card">Crea prima un evento.</div>'; return; }
  const sq = await api(`/eventi/${ev.id}/squadre`);
  $('#app').innerHTML = selettoreEvento() + `<div class="card"><h3>Squadre (${sq.filter((s) => s.attiva).length} attive)</h3>
    <table><tr><th>N.</th><th>Squadra</th><th>Comitato</th><th></th><th></th></tr>${sq.map((s) => `<tr><td>${s.numero}</td><td><input data-id="${s.id}" class="nm" value="${esc(s.nome)}"></td>
      <td><input data-id="${s.id}" class="cm" placeholder="comitato" value="${esc(s.comitato || '')}"></td>
      <td><span class="tag ${s.attiva ? 'ok' : 'no'}">${s.attiva ? 'attiva' : 'disattivata'}</span></td>
      <td style="white-space:nowrap"><button class="s p mb" data-sq="${s.id}" data-n="${esc(s.nome)}">Componenti…</button>
        <button class="s p tg" data-sq="${s.id}" data-a="${s.attiva}">${s.attiva ? 'Disattiva' : 'Riattiva'}</button></td></tr>`).join('')}</table>
    <p class="nota">Le squadre non si cancellano: si disattivano, così il numero non viene mai riusato e le valutazioni restano.</p></div>
    <div class="card"><h3>Nuova squadra</h3><div class="riga"><input id="ns" placeholder="Nome squadra"><input id="ns_c" placeholder="Comitato"><div class="stretto"><button class="b" id="ns_ok">Aggiungi</button></div></div></div>`;
  legaSelettore();
  document.querySelectorAll('.nm').forEach((i) => { i.onchange = () => fai(() => api(`/squadre/${i.dataset.id}`, { method: 'PATCH', body: { nome: i.value } }), 'Nome aggiornato'); });
  document.querySelectorAll('.cm, #ns_c').forEach((i) => legaComitato(i));
  document.querySelectorAll('.cm').forEach((i) => { i.onchange = () => fai(() => api(`/squadre/${i.dataset.id}`, { method: 'PATCH', body: { comitato: i.value } }), 'Comitato aggiornato'); });
  document.querySelectorAll('.tg').forEach((b) => { b.onclick = () => fai(() => api(`/squadre/${b.dataset.sq}`, { method: 'PATCH', body: { attiva: b.dataset.a !== 'true' } })); });
  document.querySelectorAll('.mb').forEach((b) => { b.onclick = () => apriComponenti(b.dataset.sq, b.dataset.n); });
  $('#ns_ok').onclick = () => { const n = $('#ns').value.trim(); if (n) fai(() => api(`/eventi/${ev.id}/squadre`, { body: { nome: n, comitato: $('#ns_c').value.trim() } }), 'Squadra aggiunta'); };
}

async function apriComponenti(squadraId, nomeSquadra) {
  const [membri, persone] = await Promise.all([api(`/squadre/${squadraId}/membri`), api('/persone')]);
  let lista = membri.map((m) => ({ partecipante_id: m.partecipante_id, ruolo: m.ruolo || '', cognome: m.cognome, nome: m.nome, comitato: m.comitato, provincia: m.provincia }));
  const disegna = () => {
    $('#dlg').innerHTML = `<h3>Componenti · ${esc(nomeSquadra)}</h3>
      <p class="nota">Le persone vengono dall'anagrafica (scheda «Persone»). I componenti possono appartenere a comitati diversi dalla squadra.</p>
      <table>${lista.length ? lista.map((m, i) => `<tr><td>${esc(m.cognome)} ${esc(m.nome)}<br><small>${esc(m.comitato || '—')}${m.provincia ? ' (' + esc(m.provincia) + ')' : ''}</small></td>
        <td><input class="mr" data-i="${i}" placeholder="ruolo (es. capo squadra)" value="${esc(m.ruolo)}"></td><td><button class="x p mx" data-i="${i}">✕</button></td></tr>`).join('') : '<tr><td><em>Nessun componente</em></td></tr>'}</table>
      <div class="riga" style="margin-top:10px"><div style="flex:3"><label>Aggiungi persona</label><select id="mp"><option value="">— scegli —</option>
        ${persone.filter((p) => !lista.some((m) => m.partecipante_id === p.id)).map((p) => `<option value="${p.id}">${esc(p.cognome)} ${esc(p.nome)} · ${esc(p.comitato || '—')}</option>`).join('')}</select></div>
        <div class="stretto"><button class="s" id="mpa">Aggiungi</button></div></div>
      <p><button class="b" id="mps">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`;
    document.querySelectorAll('#dlg .mr').forEach((i) => { i.oninput = () => { lista[i.dataset.i].ruolo = i.value; }; });
    document.querySelectorAll('#dlg .mx').forEach((b) => { b.onclick = () => { lista.splice(Number(b.dataset.i), 1); disegna(); }; });
    $('#mpa').onclick = () => { const p = persone.find((x) => x.id === $('#mp').value); if (!p) return;
      lista.push({ partecipante_id: p.id, ruolo: '', cognome: p.cognome, nome: p.nome, comitato: p.comitato, provincia: p.provincia }); disegna(); };
    $('#mps').onclick = () => { const body = { membri: lista.map((m) => ({ partecipante_id: m.partecipante_id, ruolo: m.ruolo.trim() || null })) }; chiudi();
      fai(() => api(`/squadre/${squadraId}/membri`, { method: 'PUT', body }), 'Componenti salvati'); };
  };
  $('#dlg').showModal(); disegna();
}

// ───────── PERSONE (anagrafica) ─────────
const RUOLI_GARA = { accompagnatore: 'accompagnatore', simulatore: 'simulatore', truccatore: 'truccatore', partecipante_leader: 'capo squadra', partecipante_membro: 'componente', giudice: 'giudice', giudice_master: 'giudice master', allenatore: 'allenatore', fotografo: 'fotografo', supporter: 'supporter', altro: 'altro' };

      <details><summary>Importa un elenco</summary><p class="nota">Una riga per comitato: <code>nome;provincia;regione;unità1|unità2</code> (si può incollare anche da Excel). Chi esiste già viene aggiornato.</p>

// ───────── LIBRERIA ─────────
const categoriaDi = (p) => (p.categoria || p.nome.split(' · ')[0] || 'Altre').trim();
function gruppiPatologie(pat) {
  const m = new Map();
  for (const p of pat) { const c = categoriaDi(p); if (!m.has(c)) m.set(c, []); m.get(c).push(p); }
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'it'));
}
const opzioniPatologie = (pat) => gruppiPatologie(pat).map(([c, l]) => `<optgroup label="${esc(c)}">${l.map((p) => `<option value="${p.id}">${esc(p.nome)}${p.categoria2 ? ' + ' + esc(p.categoria2) : ''} (${p.voci} voci)</option>`).join('')}</optgroup>`).join('');
const dataIt = (d) => (d ? d.split('-').reverse().join('/') : '');
const descGara = (u) => [u.codice || u.evento, u.luogo, dataIt(u.data)].filter(Boolean).join(' - ');
const usiTesto = (p) => (p.usi || []).map(descGara).join(' / ');
const ultimaGara = (p) => { const u = (p.usi || [])[0]; return u ? descGara(u) + (p.usi.length > 1 ? ` (+${p.usi.length - 1})` : '') : 'mai usata'; };

    tr.querySelectorAll('[data-l]').forEach((i) => { body[i.dataset.l] = i.value.trim() === '' ? null : Number(i.value); });

async function tLibreria() {
  const direzione = admin() || (me.aree || []).includes('schede');
  const conComitati = direzione && localStorage.getItem('libComitati') === '1';
  const [pat, scale] = await Promise.all([api('/libreria/patologie' + (conComitati ? '?comitati=1' : '')), api('/libreria/scale')]);
  cache.scale = scale; cache.pat = pat;
  const modificabile = (p) => (p.comitato ? (!direzione || admin()) : direzione);
  $('#app').innerHTML = `<div class="card"><h3>Schede in libreria (${pat.length})</h3>
    ${direzione ? '' : `<p class="nota">Le schede che crei qui sono visibili solo al tuo comitato. Le schede generali puoi guardarle e copiarle, ma non modificarle.</p>`}
    <p><button class="b" id="np">Nuova scheda</button> ${direzione ? '<button class="s" id="vp">Punteggi MB/BE/SU/IN/NE</button> ' : ''}<button class="s" id="nm">Nuova da modello…</button>
      ${direzione ? `<label style="display:inline-flex;gap:6px;align-items:center;font-size:15px;color:inherit;margin-left:10px"><input type="checkbox" id="vcom" ${conComitati ? 'checked' : ''}> Vedi anche schede dei comitati</label>` : ''}</p>
    <input id="pf" placeholder="Cerca (es. Ictus, frattura, Olimpiadi, Gara D)" style="margin-bottom:8px">
    ${gruppiPatologie(pat).map(([cat, l]) => `<details class="grp"><summary><strong>${esc(cat)}</strong> <span class="tag">${l.length}</span></summary><table class="lib"><colgroup><col><col style="width:70px"><col style="width:236px"></colgroup>${l.map((p) => `<tr class="pr" data-n="${esc((p.nome + ' ' + (p.categoria2 || '') + ' ' + p.sigla + ' ' + usiTesto(p)).toLowerCase())}"><td><strong>${esc(p.nome)}</strong> <span class="tag">${esc(p.sigla)}</span>
      ${p.categoria2 ? `<span class="tag">+ ${esc(p.categoria2)}</span>` : ''}${p.is_bls ? '<span class="tag">BLSD</span>' : ''}${p.is_diu ? '<span class="tag">DIU</span>' : ''}${p.is_master ? '<span class="tag">Master</span>' : ''}${p.comitato ? `<span class="tag no">Privata · ${esc(p.comitato)}</span>` : ''}
<span class="evt">${esc(ultimaGara(p))}</span></td><td>${p.voci} voci</td>
      <td style="white-space:nowrap">${modificabile(p) ? `<button class="s p ed" data-id="${p.id}">Modifica</button> ` : `<button class="s p ed" data-id="${p.id}">Apri</button> `}<button class="s p cp" data-id="${p.id}">Copia</button> ${modificabile(p) ? `<button class="x p del" data-id="${p.id}">Elimina</button>` : ''}</td></tr>`).join('')}</table></details>`).join('')}
    <p class="nota">Modificare una patologia non cambia le scene già create: ognuna ne conserva una copia.</p></div>
`;
  $('#pf').oninput = () => { const q = $('#pf').value.trim().toLowerCase();
    document.querySelectorAll('tr.pr').forEach((r) => { r.hidden = !!q && !r.dataset.n.includes(q); });
    document.querySelectorAll('details.grp').forEach((d) => { const v = d.querySelectorAll('tr.pr:not([hidden])').length; d.hidden = !v; if (q) d.open = true; }); };
  document.querySelectorAll('.cp').forEach((b) => { b.onclick = async () => { const o = pat.find((p) => p.id === b.dataset.id);
    editorPatologia({ ...o, id: null, nome: o.nome + ' (copia)' }, await api(`/libreria/patologie/${o.id}`), true); }; });
  $('#nm').onclick = () => dlg(`<h3>Nuova scheda da modello</h3><p class="nota">Scegli la scheda da cui partire: ne verrà creata una copia da modificare.</p>
    <label>Scheda modello</label><select id="nm_s">${opzioniPatologie(pat)}</select>
    <p><button class="b" id="nm_ok">Continua</button> <button class="s" onclick="chiudi()">Annulla</button></p>`) || ($('#nm_ok').onclick = async () => {
      const o = pat.find((p) => p.id === $('#nm_s').value); const v = await api(`/libreria/patologie/${o.id}`); chiudi();
      editorPatologia({ ...o, id: null, nome: '' }, v, true); });
  document.querySelectorAll('.del').forEach((b) => { b.onclick = () => { if (confirm('Eliminare la patologia?')) fai(() => api(`/libreria/patologie/${b.dataset.id}`, { method: 'DELETE' }), 'Eliminata'); }; });
  document.querySelectorAll('.ed').forEach((b) => { b.onclick = async () => editorPatologia(pat.find((p) => p.id === b.dataset.id), await api(`/libreria/patologie/${b.dataset.id}`)); });
  $('#np').onclick = () => editorPatologia(null, []);
  if ($('#vp')) $('#vp').onclick = () => vai('punteggi');
  if ($('#vcom')) $('#vcom').onchange = () => { localStorage.setItem('libComitati', $('#vcom').checked ? '1' : '0'); render(); };
}
function editorPatologia(p, voci, nuova = false) {
  const sc = cache.scale.map((s) => s.codice);
  const riga = (v = {}) => `<tr><td><input class="r_sez" value="${esc(v.sezione || '')}" placeholder="sezione"></td><td><input class="r_tx" value="${esc(v.testo || '')}" placeholder="testo della voce"></td>
    <td><select class="r_sc">${cache.scale.map((x) => `<option value="${esc(x.codice)}" ${x.codice === (v.scala || 'Standard') ? 'selected' : ''}>${esc(x.codice)} (${LIV.map((l) => x[l]).filter((n) => n !== null && n !== undefined).join(',')})</option>`).join('')}</select></td>
    <td><input type="checkbox" class="r_sep" ${v.is_sep ? 'checked' : ''}></td>
    <td style="white-space:nowrap"><button class="s p su" title="Sposta su">↑</button> <button class="s p gi" title="Sposta giù">↓</button> <button class="b p piu" title="Aggiungi una voce sotto, nella stessa sezione">＋</button> <button class="x p rm">✕</button></td></tr>`;
  const dir = admin() || (me.aree || []).includes('schede'), sola = !!(p && p.id && !nuova && (p.comitato ? (dir && !admin()) : !dir));
  dlg(`<h3>${p && !nuova ? (sola ? 'Scheda' : 'Modifica') : 'Nuova'} scheda${p?.comitato ? ` <small>(privata · ${esc(p.comitato)})</small>` : ''}</h3>${sola ? '<p class="nota">Solo lettura: usa «Copia» per averne una tua da modificare.</p>' : ''}<div class="riga">
    <div><label>Nome</label><input id="pt_n" value="${esc(p?.nome || '')}"></div><div><label>Sigla (3 lettere)</label><input id="pt_s" maxlength="4" value="${esc(p?.sigla || '')}"></div></div>
    <div class="riga"><div><label>Patologia (gruppo)</label><input id="pt_c" list="dl_cat" value="${esc(p ? categoriaDi(p) : '')}" placeholder="es. Ictus"><datalist id="dl_cat">${[...new Set((cache.pat || []).map(categoriaDi))].map((c) => `<option value="${esc(c)}">`).join('')}</datalist></div>
    <div><label>Seconda patologia (facoltativa)</label><input id="pt_c2" list="dl_cat" value="${esc(p?.categoria2 || '')}" placeholder="es. Frattura polso"></div>
    <div class="stretto"><label>BLSD</label><input type="checkbox" id="pt_b" ${p?.is_bls ? 'checked' : ''}></div><div class="stretto"><label>DIU</label><input type="checkbox" id="pt_d" ${p?.is_diu ? 'checked' : ''}></div><div class="stretto"><label>Master</label><input type="checkbox" id="pt_m" ${p?.is_master ? 'checked' : ''}></div></div>
    <table class="voci" id="pt_t"><tr><th>Sezione</th><th>Voce</th><th>Scala</th><th>SEP</th><th></th></tr>${voci.map(riga).join('')}</table>
    <p><button class="s" id="pt_add">+ Voce</button> <button class="b" id="pt_ok">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
  const t = $('#pt_t');
  if (sola) { $('#pt_ok').hidden = true; $('#pt_add').hidden = true; document.querySelectorAll('#dlg input, #dlg select').forEach((e) => { e.disabled = true; }); t.querySelectorAll('button').forEach((b) => { b.hidden = true; }); }
  $('#pt_add').onclick = () => { const last = t.querySelector('tr:last-child .r_sez'); t.insertAdjacentHTML('beforeend', riga({ sezione: last && last.closest('tr') !== t.rows[0] ? last.value : '' })); t.lastElementChild.querySelector('.r_tx').focus(); };
  t.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; const tr = b.closest('tr');
    if (b.classList.contains('piu')) { tr.insertAdjacentHTML('afterend', riga({ sezione: tr.querySelector('.r_sez').value, scala: tr.querySelector('.r_sc').value })); tr.nextElementSibling.querySelector('.r_tx').focus(); return; }
    if (b.classList.contains('rm')) tr.remove(); else if (b.classList.contains('su') && tr.previousElementSibling?.querySelector('.r_tx')) tr.previousElementSibling.before(tr);
    else if (b.classList.contains('gi') && tr.nextElementSibling) tr.nextElementSibling.after(tr); };
  $('#pt_ok').onclick = () => {
    const vv = [...t.querySelectorAll('tr')].slice(1).map((tr) => ({ sezione: tr.querySelector('.r_sez').value.trim(), testo: tr.querySelector('.r_tx').value.trim(),
      scala: tr.querySelector('.r_sc').value, is_sep: tr.querySelector('.r_sep').checked })).filter((v) => v.testo);
    if (vv.some((v) => !v.sezione)) return alert('Ogni voce deve avere una sezione');
    const body = { nome: $('#pt_n').value.trim(), sigla: $('#pt_s').value.trim().toUpperCase(), is_bls: $('#pt_b').checked, is_diu: $('#pt_d').checked, is_master: $('#pt_m').checked, categoria: $('#pt_c').value.trim(), categoria2: $('#pt_c2').value.trim(), voci: vv };
    if (!body.nome || !body.sigla) return alert('Nome e sigla obbligatori');
    chiudi();
    fai(() => p && p.id ? api(`/libreria/patologie/${p.id}`, { method: 'PUT', body }) : api('/libreria/patologie', { body: { ...body, codice: body.nome.toUpperCase().replace(/[^A-Z0-9]+/g, '_') + '_' + Date.now().toString(36).toUpperCase() } }), 'Patologia salvata');
  };
}

const aBase64 = (file) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => ko(new Error('file illeggibile')); r.readAsDataURL(file); });
async function tImporta() {
  $('#app').innerHTML = `<div class="card"><h3>Importa scene da Excel</h3>
    <p class="nota">Carica i file Excel delle scene (formato GareCRI). I file con «OLI» nel nome sono considerati Olimpiadi, gli altri gare. Ogni file diventa una scena dell'evento scelto,
      con schede e valutazioni già inserite; le schede entrano anche nella <strong>libreria</strong> come «Tipo · Gara/Olimpiadi Scena». L'evento attivo non viene cambiato.
      Una scena già presente nell'evento non viene sovrascritta, a meno che tu spunti «Sostituisci».</p>
    <input type="file" id="im_f" accept=".xlsx" multiple><div id="im_cfg"></div><div id="im_ris"></div></div>`;
  let files = [];
  const tipoDi = (f) => (/OLI/i.test(f.name) ? 'olimpiadi' : 'gara');
  const cfg = (tipo) => {
    const ex = eventi.filter((e) => e.tipo === tipo);
    return `<div class="scheda" data-tipo="${tipo}"><strong>Evento per ${tipo === 'gara' ? 'le gare' : 'le Olimpiadi'}</strong>
      <div class="riga"><div><label>Evento</label><select class="ic_ev"><option value="">➕ Nuovo evento…</option>${ex.map((e) => `<option value="${e.id}" selected>${esc(e.codice)} – ${esc(e.nome)}</option>`).join('')}</select></div></div>
      <div class="riga ic_nuovo" ${ex.length ? 'hidden' : ''}><div><label>Codice</label><input class="ic_cod" value="${tipo === 'gara' ? '' : 'OLI-' + new Date().getFullYear()}" placeholder="${tipo === 'gara' ? 'GPSER-2027' : 'OLI-2026'}"></div>
        <div><label>Nome</label><input class="ic_nome" value="${tipo === 'gara' ? '' : 'Olimpiadi di primo soccorso'}"></div>
        <div><label>Luogo</label><input class="ic_luogo"></div><div><label>Data</label><input class="ic_data" type="date"></div></div></div>`;
  };
  const disegna = () => {
    const tipi = [...new Set(files.map((f) => f.tipo))];
    $('#im_cfg').innerHTML = files.length ? `<table style="margin-top:10px"><tr><th>File</th><th>Tipo</th><th>Esito</th></tr>${files.map((f, i) => `<tr><td>${esc(f.file.name)}<br><small>${Math.round(f.file.size / 1024)} KB</small></td>
      <td><select class="im_t" data-i="${i}"><option value="gara" ${f.tipo === 'gara' ? 'selected' : ''}>gara</option><option value="olimpiadi" ${f.tipo === 'olimpiadi' ? 'selected' : ''}>olimpiadi</option></select></td>
      <td id="im_e${i}"><small>da importare</small></td></tr>`).join('')}</table>${tipi.map(cfg).join('')}
      <p><label style="font-size:14px;color:inherit"><input type="checkbox" id="im_sost"> <strong>Sostituisci</strong> le scene già presenti: cancella le loro valutazioni e le reimporta dal file</label></p>
      <p><button class="b" id="im_go">Importa ${files.length} file</button></p>` : '';
    document.querySelectorAll('.im_t').forEach((sel) => { sel.onchange = () => { files[sel.dataset.i].tipo = sel.value; disegna(); }; });
    document.querySelectorAll('.ic_ev').forEach((sel) => { sel.onchange = () => { sel.closest('.scheda').querySelector('.ic_nuovo').hidden = sel.value !== ''; }; });
    if ($('#im_go')) $('#im_go').onclick = vai;
  };
  const vai = async () => {
    const dest = {};
    for (const blocco of document.querySelectorAll('#im_cfg .scheda')) {
      const t = blocco.dataset.tipo, id = blocco.querySelector('.ic_ev').value;
      dest[t] = id ? { evento_id: id } : { evento: { codice: blocco.querySelector('.ic_cod').value.trim(), nome: blocco.querySelector('.ic_nome').value.trim(),
        luogo: blocco.querySelector('.ic_luogo').value.trim(), data: blocco.querySelector('.ic_data').value || null } };
      if (!id && (!dest[t].evento.codice || !dest[t].evento.nome)) return flash('Per un nuovo evento servono codice e nome', false);
    }
    const sostituisci = $('#im_sost').checked;
    if (sostituisci && !confirm('Le scene già presenti, con le loro valutazioni, verranno cancellate e ricaricate dai file. Continuare?')) return;
    $('#im_go').disabled = true; document.querySelectorAll('.im_t, .ic_ev').forEach((x) => (x.disabled = true));
    let ok = 0, ko = 0;
    for (const [i, f] of files.entries()) {
      const cella = $(`#im_e${i}`); cella.innerHTML = '⏳ in corso…';
      try {
        const r = await api('/import/excel', { body: { dati: await aBase64(f.file), tipo: f.tipo, sostituisci, ...dest[f.tipo] } });
        cella.innerHTML = `<span class="tag ok">✓ scena ${esc(r.scenaCodice)}</span> ${esc(r.scenaTitolo)}<br><small>${r.schede} schede · ${r.voci} voci · ${r.squadre} squadre · ${r.risposte} valutazioni</small>
          ${r.avvisi.length ? '<br><small>⚠ ' + [...new Set(r.avvisi)].slice(0, 4).map(esc).join(' · ') + '</small>' : ''}`;
        ok++;
      } catch (e) { cella.innerHTML = `<span class="tag no">✗</span> ${esc(e.message)}`; ko++; }
    }
    await caricaEventi();
    flash(`Importazione terminata: ${ok} file importati${ko ? `, ${ko} non importati` : ''}`, ko === 0);
  };
  $('#im_f').onchange = () => { files = [...$('#im_f').files].sort((a, b) => a.name.localeCompare(b.name)).map((file) => ({ file, tipo: tipoDi(file) })); disegna(); };
}

const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const oraIt = (d) => new Date(d).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
async function pdfUrl(path) {
  const r = await fetch('/api' + path, { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.errore || r.statusText); }
  return URL.createObjectURL(await r.blob());
}
// anteprima del badge in una finestra, con scelta del formato e stampa
function anteprimaBadge(S, { iscritto, ambito = 'tutti', titolo }) {
  let url = null;
  const q = iscritto ? `iscritto=${iscritto}` : `ambito=${encodeURIComponent(ambito)}`;
  dlg(`<div style="min-width:min(840px,88vw)"><h3>${esc(titolo)}</h3><div class="riga"><div><label>Formato del badge</label><select id="bd_f">${S.formati.map((f) => `<option value="${f.id}" ${f.id === S.formato ? 'selected' : ''}>${esc(f.nome)}${f.sistema ? '' : ' (' + f.larghezza_mm + '×' + f.altezza_mm + ' mm)'}</option>`).join('')}</select></div>
    <div class="stretto"><button class="b" id="bd_p">Stampa</button> <button class="s" id="bd_o">Apri in una scheda</button> <button class="s" onclick="chiudi()">Chiudi</button></div></div>
    <iframe id="bd_if" title="Anteprima badge" style="width:100%;height:62vh;border:1px solid #ccc;margin-top:8px;background:#eee"></iframe></div>`);
  const carica = async () => {
    try { const nuovo = await pdfUrl(`/eventi/${ev.id}/badge.pdf?${q}&formato=${$('#bd_f').value}`); if (url) URL.revokeObjectURL(url); url = nuovo; $('#bd_if').src = url; }
    catch (e) { $('#bd_if').srcdoc = `<p style="font-family:sans-serif;color:#b00;padding:12px">${esc(e.message)}</p>`; }
  };
  $('#bd_f').onchange = () => { S.formato = $('#bd_f').value; api(`/eventi/${ev.id}/formato-badge`, { method: 'PUT', body: { formato_badge_id: S.formato } }).catch(() => {}); carica(); };
  $('#bd_p').onclick = () => { const f = $('#bd_if').contentWindow; f.focus(); f.print(); };
  $('#bd_o').onclick = () => { if (url) window.open(url, '_blank'); };
  carica();
}

  $('#sg_fmt').onclick = () => dialogFormati(S);

    document.querySelectorAll('.md').forEach((b) => { b.onclick = () => dialogIscritto(S, per(b.dataset.id)); });
    document.querySelectorAll('.el').forEach((b) => { b.onclick = () => { const i = per(b.dataset.id); if (confirm(`Togliere ${i.cognome} ${i.nome} dalla gara?`)) fai(() => api(`/iscritti/${i.id}`, { method: 'DELETE' }), 'Tolto dalla gara'); }; });

}

async function dialogRisorseScena(R, sc, ruolo, etichetta) {
  const cand = R.persone.filter((p) => p.ruolo === ruolo);
  const nomeScena = (id) => { const x = R.scene.find((q) => q.id === id); return x ? x.codice : ''; };
  dlg(`<h3>${etichetta} · scena ${esc(sc.codice)}</h3>${cand.length ? cand.map((p) => { const altre = p.scene.filter((i) => i !== sc.id);
      return `<label style="font-size:15px;color:inherit"><input type="checkbox" value="${p.id}" ${sc.risorse.includes(p.id) ? 'checked' : ''}> ${esc(p.cognome)} ${esc(p.nome)} <small>${esc(p.comitato || '')}${p.arrivato_at ? ' · arrivato' : ''}${altre.length ? ' · anche in scena ' + altre.map(nomeScena).join(', ') : ''}</small></label>`; }).join('')
    : `<p>Nessuno iscritto con questo ruolo. Aggiungilo dalla Segreteria (ruolo «${esc(etichetta)}»).</p>`}
    <p><button class="b" id="rs_ok">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
  $('#rs_ok').onclick = () => {

// giudici di una scheda scelti tra gli iscritti alla gara (Segreteria): chi è arrivato è in evidenza
async function dialogGiudiciRisorse(R, schedaId, ass) {
  const utenti = (await api('/giudici')).filter((u) => u.ruolo === 'giudice');
  const sel = new Set(ass.filter((a) => a.scheda_id === schedaId).map((a) => a.utente_id));
  const iscr = new Map(R.persone.filter((p) => p.utente_id).map((p) => [p.utente_id, p]));
  const dove = (uid) => R.scene.flatMap((sc) => sc.schede.filter((k) => k.id !== schedaId && k.giudici.some((g) => g.utente_id === uid)).map((k) => `${sc.codice} · ${k.titolo}`));
  const riga = (u) => { const p = iscr.get(u.id), altre = dove(u.id);
    return `<label style="font-size:15px;color:inherit"><input type="checkbox" value="${u.id}" ${sel.has(u.id) ? 'checked' : ''}> ${esc(u.nome)} <small>${p ? (p.arrivato_at ? 'arrivato' : 'iscritto, non ancora arrivato') : esc(u.email)}${altre.length ? ' · già su ' + esc(altre.join('; ')) : ''}</small></label>`; };
  const iscritti = utenti.filter((u) => iscr.has(u.id)), altri = utenti.filter((u) => !iscr.has(u.id));
  const senza = R.persone.filter((p) => ['giudice', 'giudice_master'].includes(p.ruolo) && !p.utente_id);
  dlg(`<h3>Giudici della scheda</h3>
    <p><b>Iscritti alla gara</b></p>${iscritti.length ? iscritti.map(riga).join('') : '<p class="nota">Nessun giudice iscritto con un account. Iscrivi i giudici dalla Segreteria e collegali a un utente.</p>'}
    ${senza.length ? `<p class="nota">Iscritti come giudici ma senza account (non possono accedere): ${senza.map((p) => esc(p.cognome + ' ' + p.nome)).join(', ')}.</p>` : ''}
    ${altri.length ? `<details style="margin-top:8px"><summary>Altri giudici non iscritti a questa gara (${altri.length})</summary>${altri.map(riga).join('')}</details>` : ''}
    <p><button class="b" id="gs_ok">Salva</button> <button class="s" onclick="chiudi()">Annulla</button></p>`);
  $('#gs_ok').onclick = () => { const ids = [...document.querySelectorAll('#dlg input:checked')].map((i) => i.value); chiudi();
    fai(() => api(`/schede/${schedaId}/assegnazioni`, { method: 'PUT', body: { utenti: ids } }), 'Giudici assegnati'); };
}
async function tRisorse() {
  if (!ev) { $('#app').innerHTML = selettoreEvento() + '<div class="card">Crea prima una gara.</div>'; legaSelettore(); return; }
  const R = await api(`/eventi/${ev.id}/risorse`);
  const NOMI = { giudice: 'Giudici', giudice_master: 'Giudici master', simulatore: 'Simulatori', truccatore: 'Truccatori' };
  const chips = Object.entries(R.conteggi).map(([k, c]) => `<div class="tile-ris"><b>${c.assegnati}/${c.totale}</b><span>${NOMI[k]} assegnati</span><small>${c.arrivati} arrivati${c.senza_account ? ` · ${c.senza_account} senza account` : ''}</small></div>`).join('');
  const nomi = (ids) => ids.map((i) => R.persone.find((p) => p.id === i)).filter(Boolean);
  const scene = R.scene.map((sc) => {
    const sim = nomi(sc.risorse).filter((p) => p.ruolo === 'simulatore'), tru = nomi(sc.risorse).filter((p) => p.ruolo === 'truccatore');
    const lista = (l) => l.length ? l.map((p) => `${esc(p.cognome)} ${esc(p.nome)}`).join(', ') : '<em>nessuno</em>';
    return `<div class="card"><h3 style="margin:0">Scena ${esc(sc.codice)} · ${esc(sc.titolo)}</h3>
      <p><b>Giudice master:</b> ${sc.master.length ? sc.master.map((m) => esc(m.nome)).join(', ') : '<em>da assegnare</em>'} <button class="s p rmas" data-id="${sc.id}">Modifica</button></p>
      <table>${sc.schede.map((k) => `<tr><td>${esc(k.titolo)}</td><td>${k.giudici.length ? k.giudici.map((g) => esc(g.nome)).join(', ') : '<em>nessun giudice</em>'}</td><td><button class="s p rg" data-id="${k.id}">Giudici</button></td></tr>`).join('') || '<tr><td><em>Nessuna scheda</em></td></tr>'}</table>
      <p><b>Simulatori:</b> ${lista(sim)} <button class="s p rs" data-id="${sc.id}" data-r="simulatore">Modifica</button></p>
      <p><b>Truccatori:</b> ${lista(tru)} <button class="s p rs" data-id="${sc.id}" data-r="truccatore">Modifica</button></p></div>`;
  }).join('');
  const liberi = R.persone.filter((p) => ['simulatore', 'truccatore'].includes(p.ruolo) && !p.scene.length);
  $('#app').innerHTML = selettoreEvento() + `<div class="card"><div class="chips-ris">${chips}</div>
    <p class="nota">Gli iscritti si registrano dalla Segreteria. I giudici assegnati a una scheda trovano quella scheda già pronta quando aprono la Valutazione.</p>
    ${liberi.length ? `<p><b>Da assegnare a una scena:</b> ${liberi.map((p) => `${esc(p.cognome)} ${esc(p.nome)} <small>(${p.ruolo})</small>`).join(', ')}</p>` : ''}</div>${scene || '<div class="card">Nessuna scena in questa gara.</div>'}`;
  legaSelettore();
  const ass = R.scene.flatMap((sc) => sc.schede.flatMap((k) => k.giudici.map((g) => ({ scheda_id: k.id, utente_id: g.utente_id }))));
  document.querySelectorAll('.rg').forEach((b) => { b.onclick = () => dialogGiudiciRisorse(R, b.dataset.id, ass); });
  const mas = R.scene.flatMap((sc) => sc.master.map((m) => ({ scena_id: sc.id, utente_id: m.utente_id })));
  document.querySelectorAll('.rmas').forEach((b) => { b.onclick = () => apriMaster(b.dataset.id, mas); });
  document.querySelectorAll('.rs').forEach((b) => { b.onclick = () => dialogRisorseScena(R, R.scene.find((q) => q.id === b.dataset.id), b.dataset.r, b.dataset.r === 'simulatore' ? 'Simulatori' : 'Truccatori'); });
}

      <br><label style="font-size:13px;color:inherit"><input type="checkbox" class="ad" data-id="${x.id}" ${x.admin ? 'checked' : ''}> Admin</label></td>
    <td><select class="ug" data-id="${x.id}"><option value="">gara attiva</option>${eventi.map((e) => `<option value="${e.id}" ${e.id === x.evento_id ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></td>
    <td><span class="tag ${x.attivo ? 'ok' : 'no'}">${x.attivo ? 'attivo' : 'disattivato'}</span><br><span class="tag ${x.mfa_attiva ? 'ok' : ''}">MFA ${x.mfa_attiva ? 'sì' : 'no'}</span>${(x.identita || []).map((i) => `<span class="tag">${esc(i)}</span>`).join('')}</td>
    <td><button class="s p pw" data-id="${x.id}">Password</button> ${x.mfa_attiva ? `<button class="x p mfr" data-id="${x.id}">Reset MFA</button> ` : ''}<button class="s p at" data-id="${x.id}" data-a="${x.attivo}">${x.attivo ? 'Disattiva' : 'Riattiva'}</button></td></tr>`).join('')}</table></div>
    <div class="card"><h3>Nuovo utente</h3><div class="riga"><div><label>Nome</label><input id="u_n"></div><div><label>Cognome</label><input id="u_cg"></div><div><label>Email</label><input id="u_e" type="email"></div>
    <div><label>Ruolo</label><select id="u_r">${ruoli.map((r) => `<option value="${r.codice}">${esc(r.nome)}</option>`).join('')}</select></div>
    <div><label>Amministratore</label><label style="font-size:14px;color:inherit"><input type="checkbox" id="u_ad"> in più al ruolo</label></div>
    <div><label>Password (min. 8)</label><input id="u_p" type="text"></div>
    <div><label>Solo accesso Google/Microsoft</label><label style="font-size:14px;color:inherit"><input type="checkbox" id="u_sso"> senza password</label></div><div class="stretto"><button class="b" id="u_ok">Crea</button></div></div></div>`;
  document.querySelectorAll('.ru').forEach((s) => { s.onchange = () => fai(() => api(`/utenti/${s.dataset.id}`, { method: 'PATCH', body: { ruolo: s.value } }), 'Ruolo aggiornato'); });
  document.querySelectorAll('.ug').forEach((s) => { s.onchange = () => fai(() => api(`/utenti/${s.dataset.id}`, { method: 'PATCH', body: { evento_id: s.value || null } }), 'Gara assegnata'); });
  document.querySelectorAll('.mfr').forEach((b) => { b.onclick = () => { if (confirm('Azzerare la MFA di questo utente? Al prossimo accesso dovrà rifare la configurazione.')) fai(() => api(`/utenti/${b.dataset.id}/mfa-reset`, { body: {} }), 'MFA azzerata'); }; });
  document.querySelectorAll('.at').forEach((b) => { b.onclick = () => fai(() => api(`/utenti/${b.dataset.id}`, { method: 'PATCH', body: { attivo: b.dataset.a !== 'true' } })); });
  document.querySelectorAll('.pw').forEach((b) => { b.onclick = () => { const p = prompt('Nuova password (min. 8 caratteri):'); if (p) fai(() => api(`/utenti/${b.dataset.id}`, { method: 'PATCH', body: { password: p } }), 'Password cambiata'); }; });
  $('#u_ok').onclick = () => fai(() => api('/utenti', { body: { nome: $('#u_n').value.trim(), cognome: $('#u_cg').value.trim(), admin: $('#u_ad').checked, email: $('#u_e').value.trim(), ruolo: $('#u_r').value, password: $('#u_p').value, solo_sso: $('#u_sso').checked } }), 'Utente creato (aggiunto anche in anagrafica)');
  document.querySelectorAll('.ad').forEach((c) => { c.onchange = () => fai(() => api(`/utenti/${c.dataset.id}`, { method: 'PATCH', body: { admin: c.checked } }), 'Admin aggiornato'); });
}

// ───────── RUOLI E PERMESSI ─────────
async function tRuoli() {
  const { ruoli, aree } = await api('/ruoli');
  const casella = (r, k) => `<label class="ar"><input type="checkbox" data-k="${k}" ${r.aree.includes(k) ? 'checked' : ''} ${r.sistema && r.codice !== 'organizzazione' ? 'disabled' : ''}> ${esc(aree[k])}</label>`;
  $('#app').innerHTML = `<div class="card"><h3>Ruoli e permessi</h3>
    <p><small>Ogni persona ha un ruolo. Spunta le aree di Gestione a cui il ruolo può accedere: chi non ne ha nessuna usa solo l'app (giudice, giudice master) o la Home. Utenti, Ruoli e Richieste sono riservati agli admin (spunta "Admin" sull'utente).</small></p>
    ${ruoli.map((r) => `<div class="card" style="margin:8px 0" data-c="${r.codice}"><b>${esc(r.nome)}</b> ${r.sistema ? '<span class="tag">di base</span>' : ''} <small>${r.utenti} utenti</small>
      <div class="aree">${Object.keys(aree).map((k) => casella(r, k)).join('')}</div>
      ${r.sistema && r.codice !== 'organizzazione' ? '<small>Nessun accesso alla Gestione: ruolo di base.</small>' : `<button class="b p rs">Salva</button>`} ${r.sistema ? '' : '<button class="x p rd">Elimina</button>'}</div>`).join('')}
  </div>
  <div class="card"><h3>Nuovo ruolo</h3><div class="riga"><div><label>Nome (es. Segreteria, Gestore news)</label><input id="nr_n"></div></div>
    <div class="aree">${Object.keys(aree).map((k) => casella({ aree: [], sistema: false }, k)).join('')}</div><p><button class="b" id="nr_ok">Crea ruolo</button></p></div>`;
  const scelte = (el) => [...el.querySelectorAll('input[data-k]')].filter((i) => i.checked).map((i) => i.dataset.k);
  document.querySelectorAll('.rs').forEach((b) => { b.onclick = () => fai(() => api(`/ruoli/${b.closest('[data-c]').dataset.c}`, { method: 'PUT', body: { aree: scelte(b.closest('[data-c]')) } }), 'Permessi salvati'); });
  document.querySelectorAll('.rd').forEach((b) => { b.onclick = () => { if (confirm('Eliminare il ruolo?')) fai(() => api(`/ruoli/${b.closest('[data-c]').dataset.c}`, { method: 'DELETE' }), 'Ruolo eliminato'); }; });
  $('#nr_ok').onclick = () => { const n = $('#nr_n').value.trim(); if (!n) return alert('Scrivi il nome del ruolo'); fai(() => api('/ruoli', { body: { nome: n, aree: scelte($('#nr_ok').closest('.card')) } }), 'Ruolo creato'); };
}

async function render() {
  if (!consentito(tab)) tab = 'menu';
  try {
    if (tab === 'menu') tMenu(); else if (tab === 'news') await tNews(); else if (tab === 'classifiche') await tClassifiche(); else if (tab === 'stampa') await tStampa(); else if (tab === 'evento') await tEvento(); else if (tab === 'squadre') await tSquadre(); else if (tab === 'scene') await tScene();
    else if (tab === 'persone') await tPersone(); else if (tab === 'comitati') await tComitati(); else if (tab === 'libreria') await tLibreria(); else if (tab === 'importa') await tImporta(); else if (tab === 'utenti') await tUtenti(); else if (tab === 'richieste') await tRichieste(); else if (tab === 'ruoli') await tRuoli(); else if (tab === 'punteggi') await tPunteggi(); else if (tab === 'segreteria') await tSegreteria(); else if (tab === 'risorse') await tRisorse(); else if (tab === 'documenti') await tDocumenti();
  } catch (e) { $('#app').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  const g = gruppoDi(tab), nVis = g ? figliVisibili(g).length : 0;
  const mezzo = g && nVis > 1 ? ` › <span>${esc(g[1])}</span>` : '';          // il contenitore compare solo se ha più sezioni
  $('#app').insertAdjacentHTML('afterbegin', `<div class="dove"><a href="#" id="dv_g">Gestione</a>${mezzo}${tab !== 'menu' ? ` › <b>${esc(nomeTab(tab))}</b>` : ''}</div><div class="navbar">${tab !== 'menu' ? '<button id="nv_g">← Torna a Gestione</button>' : ''}<a href="/#">Torna alla Home</a></div>`);
  if ($('#nv_g')) $('#nv_g').onclick = () => vai('menu');
  $('#dv_g').onclick = (e) => { e.preventDefault(); vai('menu'); };
  window.scrollTo(0, 0);
}
(async () => {
  if (!token || !me) { location.href = '/'; return; }
  if (!['admin', 'organizzazione'].includes(me.ruolo)) { document.body.innerHTML = '<main><div class="card">Area riservata all\'organizzazione. <a href="/">Torna alle valutazioni</a></div></main>'; return; }
  try { me = await api('/me'); localStorage.setItem('me', JSON.stringify(me)); } catch (e) { /* offline: resta il profilo salvato */ }
  if (!['admin', 'organizzazione'].includes(me.ruolo)) { document.body.innerHTML = '<main><div class="card">Area riservata. <a href="/">Torna alla Home</a></div></main>'; return; }
  $('#chi').textContent = me.nome; const h0 = location.hash.slice(1); tab = TABS.some(([k]) => k === h0) && consentito(h0) ? h0 : 'menu';
  disegnaTabs(); await caricaEventi(); render();
})();
</script>
