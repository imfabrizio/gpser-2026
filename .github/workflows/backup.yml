# Backup pianificato di GPSER-2026: ogni 6 ore chiede al sito di salvare database e sito nel repository privato dei backup.
# Serve il segreto BACKUP_CRON_TOKEN (stesso valore messo su Render). Il sito si addormenta sul piano gratuito: la richiesta lo risveglia.
name: Backup
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Chiede il backup al sito
        env:
          TOKEN: ${{ secrets.BACKUP_CRON_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "X-Backup-Token: $TOKEN" -H "Content-Type: application/json" -d '{}' \
            https://gpser.fbcri.eu/api/backup/automatico
